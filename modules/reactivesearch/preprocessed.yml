targets:
- compiler: go
  flags:
    pkg: reactivesearch
  output: ./
- compiler: js
  flags:
    js-sdk-location: ../sdk
  output: ../project-generator/react-new/src/modules/fireback/sdk/reactivesearch
  tags:
  - typescript
  - react
  - no-sdk
- compiler: preprocessor
  output: ./
description: Reactive (websocket) search across whatever sources a project registers.
  Split out of modules/fireback (which used to hardcode FirebackApp.SearchProviders
  and wire this route for every project unconditionally) - a project only gets the
  /reactive-search route if its main.go calls reactivesearch.ModuleSetup, passing
  the list of SearchProviderFn sources it wants searched via ReactiveSearchModuleConfig.
name: reactivesearch
dtos:
- name: reactiveSearchResult
  fields:
  - name: uniqueId
    type: string
  - name: phrase
    type: string
  - name: icon
    type: string
  - name: description
    type: string
  - name: group
    type: string
  - name: uiLocation
    type: string
  - name: actionFn
    type: string
actions:
- name: ReactiveSearch
  url: /reactive-search
  method: reactive
  description: Reactive search is a general purpose search mechanism for different
    modules, and could be used in mobile apps or front-end to quickly search for a
    entity.
