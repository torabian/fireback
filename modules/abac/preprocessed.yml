      target: CapabilityInfoDto
    - name: nested
      type: collection
      target: CapabilityInfoDto
- name: QueryUserRoleWorkspaces
  cliName: urw
  url: /urw/query
  method: get
  description: Returns the workspaces that user belongs to, as well as his role in
    there, and the permissions for each role
  out:
    envelope: GResponse
    fields:
    - name: name
      type: string
    - name: capabilities
      description: Workspace level capabilities which are available
      type: slice
      primitive: string
    - name: uniqueId
      type: string
    - name: roles
      type: array
      fields:
      - name: name
        type: string
      - name: uniqueId
        type: string
      - name: capabilities
        description: Capabilities related to this role which are available
        type: slice
        primitive: string
- name: Whoami
  cliName: whoami
  url: /whoami
  method: get
  description: Returns information about the currently authenticated user - their
    userId, and every workspace they belong to along with their role(s) and capabilities
    in each (the same UserRoleWorkspace shape QueryUserRoleWorkspaces returns).
  out:
    envelope: GResponse
    fields:
    - name: userId
      type: string
    - name: workspaces
      type: array
      fields:
      - name: name
        type: string
      - name: uniqueId
        type: string
      - name: capabilities
        description: Workspace level capabilities which are available
        type: slice
        primitive: string
      - name: roles
        type: array
        fields:
        - name: name
          type: string
        - name: uniqueId
          type: string
        - name: capabilities
          description: Capabilities related to this role which are available
          type: slice
          primitive: string
- name: InviteToWorkspace
  cliName: invite
  url: /workspace/invite
  method: post
  description: Invite a new person (either a user, with passport or without passport)
  in:
    dto: WorkspaceInvitationDto
  out:
    dto: WorkspaceInvitationDto
- name: UserInvitations
  url: /users/invitations
  method: get
  description: Shows the invitations for an specific user, if the invited member already
    has a account. It's based on the passports, so if the passport is authenticated
    we will show them.
  out:
    envelope: GResponse
    fields:
    - name: userId
      description: UserUniqueId
      type: string
    - name: uniqueId
      description: Invitation unique id
      type: string
    - name: value
      description: The value of the passport (email/phone)
      type: string
    - name: roleName
      description: Name of the role that user will get
      type: string
    - name: workspaceName
      description: Name of the workspace which user is invited to.
      type: string
    - name: type
      description: The method of the invitation, such as email.
      type: string
    - name: coverLetter
      description: The content that user will receive to understand the reason of
        the letter.
      type: string
- name: Signout
  url: /passport/signout
  method: post
  description: Signout the user, clears cookies or does anything else if needed.
  in:
    fields:
    - name: clear
      type: bool?
  out:
    envelope: GResponse
    fields:
    - name: okay
      type: bool
- name: OauthAuthenticate
  url: /passport/via-oauth
  method: post
  description: When a token is got from a oauth service such as google, we send the
    token here to authenticate the user. To me seems this doesn't need to have 2FA
    or anything, so we return the session directly, or maybe there needs to be next
    step.
  in:
    fields:
    - name: token
      description: The token that Auth2 provider returned to the front-end, which
        will be used to validate the backend
      type: string
    - name: service
      description: The service name, such as 'google' which later backend will use
        to authorize the token and create the user.
      type: string
  out:
    envelope: GResponse
    fields:
    - name: session
      type: one
      target: UserSessionDto
    - name: next
      description: The next possible action which is suggested.
      type: slice
      primitive: string
- name: AcceptInvite
  url: /user/invitation/accept
  method: post
  description: Use it when user accepts an invitation, and it will complete the joining
    process
  in:
    fields:
    - name: invitationUniqueId
      description: The invitation id which will be used to process
      type: string
      tags:
        validate: required
  out:
    envelope: GResponse
    fields:
    - name: accepted
      type: bool
- name: ConfirmClassicPassportTotp
  url: /passport/totp/confirm
  method: post
  description: When user requires to setup the totp for an specifc passport, they
    can use this endpoint to confirm it.
  in:
    fields:
    - name: value
      description: Passport value, email or phone number which is already successfully
        registered.
      type: string
      tags:
        validate: required
    - name: password
      description: Password related to the passport. Totp is only available for passports
        with a password. Basically totp is protecting passport, not otp over email
        or sms.
      type: string
      tags:
        validate: required
    - name: totpCode
      description: The totp code generated by authenticator such as google or microsft
        apps.
      type: string
      tags:
        validate: required
  out:
    envelope: GResponse
    fields:
    - name: session
      type: one
      target: UserSessionDto
- name: ChangePassword
  cliName: cp
  url: /passport/change-password
  method: post
  description: Change the password for a given passport of the user. User needs to
    be authenticated in order to be able to change the password for a given account.
  in:
    fields:
    - name: password
      description: New password meeting the security requirements.
      type: string
      tags:
        validate: required
    - name: uniqueId
      description: The passport uniqueId (not the email or phone number) which password
        would be applied to. Don't confuse with value.
      type: string
      tags:
        validate: required
  out:
    envelope: GResponse
    fields:
    - name: changed
      type: bool
- name: UserPassports
  url: /user/passports
  method: get
  description: Returns list of passports belongs to an specific user.
  out:
    envelope: GResponse
    fields:
    - name: value
      description: The passport value, such as email address or phone number
      type: string
    - name: uniqueId
      description: Unique identifier of the passport to operate some action on top
        of it
      type: string
    - name: type
      description: The type of the passport, such as email, phone number
      type: string
    - name: totpConfirmed
      description: Regardless of the secret, user needs to confirm his secret. There
        is an extra action to confirm user totp, could be used after signup or prior
        to login.
      type: bool
- name: CreateWorkspace
  url: /workspaces/create
  method: post
  in:
    fields:
    - name: name
      type: string
  out:
    envelope: GResponse
    fields:
    - name: workspaceId
      type: string
- name: ClassicPassportRequestOtp
  cliName: otp-request
  url: /workspace/passport/request-otp
  method: post
  description: Triggers an otp request, and will send an sms or email to the passport.
    This endpoint is not used for login, but rather makes a request at initial step.
    Later you can call classicPassportOtp to get in.
  in:
    fields:
    - name: value
      description: Passport value (email, phone number) which would be receiving the
        otp code.
      type: string
      tags:
        validate: required
  out:
    envelope: GResponse
    fields:
    - name: suspendUntil
      type: int64
    - name: validUntil
      type: int64
    - name: blockedUntil
      type: int64
    - name: secondsToUnblock
      description: The amount of time left to unblock for next request
      type: int64
- name: ClassicPassportOtp
  cliName: otp
  url: /workspace/passport/otp
  method: post
  description: Authenticate the user publicly for classic methods using communication
    service, such as sms, call, or email. You need to call classicPassportRequestOtp
    beforehand to send a otp code, and then validate it with this API. Also checkClassicPassport
    action might already sent the otp, so make sure you don't send it twice.
  in:
    fields:
    - name: value
      type: string
      tags:
        validate: required
    - name: otp
      type: string
      tags:
        validate: required
  out:
    envelope: GResponse
    fields:
    - name: session
      description: Upon successful authentication, there will be a session dto generated,
        which is a ground information of authorized user and can be stored in front-end.
      type: one?
      target: UserSessionDto
    - name: totpUrl
      description: If time based otp is available, we add it response to make it easier
        for ui.
      type: string
    - name: sessionSecret
      description: The session secret will be used to call complete user registration
        api.
      type: string
    - name: continueWithCreation
      description: If return true, means the OTP is correct and user needs to be created
        before continue the authentication process.
      type: bool
- name: CheckClassicPassport
  cliName: ccp
  url: /workspace/passport/check
  method: post
  description: Checks if a classic passport (email, phone) exists or not, used in
    multi step authentication
  in:
    fields:
    - name: value
      type: string
      tags:
        validate: required
    - name: securityToken
      description: This can be the value of ReCaptcha2, ReCaptcha3, or generate security
        image or voice for verification. Will be used based on the configuration.
      type: string
  out:
    envelope: GResponse
    fields:
    - name: next
      description: The next possible action which is suggested.
      type: slice
      primitive: string
    - name: flags
      description: Extra information that can be useful actually when doing onboarding.
        Make sure sensitive information doesn't go out.
      type: slice
      primitive: string
    - name: otpInfo
      description: If the endpoint automatically triggers a send otp, then it would
        be holding that information, Also the otp information can become available.
      type: object?
      fields:
      - name: suspendUntil
        type: int64
      - name: validUntil
        type: int64
      - name: blockedUntil
        type: int64
      - name: secondsToUnblock
        description: The amount of time left to unblock for next request
        type: int64
- name: ClassicSignup
  cliName: up
  url: /passports/signup/classic
  method: post
  description: Signup a user into system via public access (aka website visitors)
    using either email or phone number.
  in:
    fields:
    - name: value
      type: string
      tags:
        validate: required
    - name: sessionSecret
      description: Required when the account creation requires recaptcha, or otp approval
        first. If such requirements are there, you first need to follow the otp apis,
        get the session secret and pass it here to complete the setup.
      type: string
    - name: type
      type: enum
      of:
      - k: phonenumber
      - k: email
      tags:
        validate: required
    - name: password
      type: string
      tags:
        validate: required
    - name: firstName
      type: string
      tags:
        validate: required
    - name: lastName
      type: string
      tags:
        validate: required
    - name: inviteId
      type: string?
    - name: publicJoinKeyId
      type: string?
    - name: workspaceTypeId
      type: string?
      tags:
        validate: required
  out:
    envelope: GResponse
    fields:
    - name: session
      description: Returns the user session in case that signup is completely successful.
      type: one
      target: UserSessionDto
    - name: totpUrl
      description: If time based otp is available, we add it response to make it easier
        for ui.
      type: string
    - name: continueToTotp
      description: Returns true and session will be empty if, the totp is required
        by the installation. In such scenario, you need to forward user to setup totp
        screen.
      type: bool
    - name: forcedTotp
      description: Determines if user must complete totp in order to continue based
        on workspace or installation
      type: bool
- name: ClassicSignin
  cliName: in
  url: /passports/signin/classic
  method: post
  description: Signin publicly to and account using class passports (email, password)
  in:
    fields:
    - name: value
      type: string
      tags:
        validate: required
    - name: password
      type: string
      tags:
        validate: required
    - name: totpCode
      description: Accepts login with totp code. If enabled, first login would return
        a success response with next[enter-totp] value and ui can understand that
        user needs to be navigated into the screen other screen.
      type: string
    - name: sessionSecret
      description: Session secret when logging in to the application requires more
        steps to complete.
      type: string
  out:
    envelope: GResponse
    fields:
    - name: session
      type: one
      target: UserSessionDto
    - name: next
      description: The next possible action which is suggested.
      type: slice
      primitive: string
    - name: totpUrl
      description: In case the account doesn't have totp, but enforced by installation,
        this value will contain the link
      type: string
    - name: sessionSecret
      description: Returns a secret session if the authentication requires more steps.
      type: string
