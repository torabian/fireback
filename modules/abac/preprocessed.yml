    type: string?
  - name: title
    type: string?
    tags:
      validate: required,omitempty,min=1,max=250
  - name: description
    type: string?
  - name: slug
    description: Unique, URL-safe identifier for this workspace type. Must start with
      "/", contain only lowercase a-z and dashes after that, and be at most 50 characters
      long. Format is enforced in ValidateTheWorkspaceTypeEntity (WorkspaceTypeActions.go);
      gorm:"unique" here is the DB-level backstop for the uniqueness half of that.
    type: string?
    tags:
      validate: required,omitempty,min=2,max=50
  - name: roleId
    description: The role which will be used to define the functionality of this workspace.
      Role needs to be created before hand, and only roles which belong to root workspace
      are possible to be selected.
    type: string?
    tags:
      validate: required
  - name: workspaceId
    type: string?
  - name: userId
    type: string?
  - name: createdAt
    type: complex
    complex: PlainTime
  - name: updatedAt
    type: complex
