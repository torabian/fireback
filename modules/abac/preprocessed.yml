- description: Every field of the "passportMethod" entity, but optional - used both
    as Update's partial input and as Browse's response item shape.
  name: passportMethodOptional
  fields:
  - name: uniqueId
    type: string?
  - name: type
    type: enum?
    of:
    - k: email
      description: Authenticate users using email
    - k: phone
      description: Authenticat users using phone number, can be sms, calls, or whatsapp.
    - k: google
      description: Users can be authenticated using their google account
    - k: facebook
      description: Users can be authenticated using their facebook account
    tags:
      validate: oneof=email phone google facebook,required
  - name: region
    description: The region which would be using this method of passports for authentication.
      In Fireback open-source, only 'global' is available.
    type: enum?
    default: global
    of:
    - k: global
    tags:
      validate: required,oneof=global
