targets:
- compiler: go
  flags:
    pkg: abacdefs
  output: ./defs
- compiler: js
  flags:
    js-sdk-location: ../sdk
  output: ../../ui/src/modules/sdk/abac
  tags:
  - typescript
  - react
  - no-package
  - no-sdk
  clean: true
- compiler: preprocessor
  output: ./
description: Fireback ABAC module provides user authentication, basic support for
  most projects, including advanced role, permission module on top of fireback core
  module. Using this module is not essential to create fireback projects, but provides
  a great possibility to avoid building most user management flow. Some other helpers,
  such as timezone are added here.
name: abac
