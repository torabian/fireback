- description: Workspace invitation has some common usage, so it's put here.
  name: workspaceInvitation
  fields:
  - name: publicKey
    description: A long hash to get the user into the confirm or signup page without
      sending the email or phone number, for example if an administrator wants to
      copy the link.
    type: string
  - name: coverLetter
    description: The content that user will receive to understand the reason of the
      letter.
    type: string
  - name: targetUserLocale
    description: If the invited person has a different language, then you can define
      that so the interface for him will be automatically translated.
    type: string
  - name: email
    description: The email address of the person which is invited.
    type: string
  - name: phonenumber
    description: The phone number of the person which is invited.
    type: string
  - name: workspace
    description: Workspace which user is being invite to.
    type: one
    target: WorkspaceEntity
  - name: firstName
    description: First name of the person which is invited
    type: string
    tags:
      validate: required
  - name: lastName
    description: Last name of the person which is invited.
    type: string
    tags:
      validate: required
  - name: forceEmailAddress
    description: If forced, the email address cannot be changed by the user which
      has been invited.
    type: bool?
  - name: forcePhoneNumber
    description: If forced, user cannot change the phone number and needs to complete
      signup.
    type: bool?
  - name: roleId
    description: The role which invitee get if they accept the request.
    type: string
    tags:
      validate: required
- description: Capability and permission level which is suitable for front-end application
