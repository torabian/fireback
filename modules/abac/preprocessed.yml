    tags:
      validate: required
  - name: region
    description: Region or locale this content applies to, for example any, us, eu,
      or asia/*. Use any unless you need to target a specific region.
    type: string?
    tags:
      validate: required
  - name: title
    description: Optional subject line - only used for email-type content.
    type: string?
  - name: languageId
    description: Language code this content is written in, for example en, fa, or
      pl. Falls back to English if nothing matches a user's language.
    type: string?
