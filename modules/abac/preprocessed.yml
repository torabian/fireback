  name: workspaceConfig
  fields:
  - name: uniqueId
    type: string?
  - name: enableRecaptcha2
    description: Enables the recaptcha2 for authentication flow.
    type: bool?
  - name: enableOtp
    description: Enables the otp option. It's not forcing it, so user can choose if
      they want otp or password.
    type: bool?
  - name: requireOtpOnSignup
    description: Forces the user to have otp verification before can create an account.
      They can define their password still.
    type: bool?
  - name: requireOtpOnSignin
    description: Forces the user to use otp when signing in. Even if they have password
      set, they won't use it and only will be able to signin using that otp.
    type: bool?
  - name: recaptcha2ServerKey
    description: Secret which would be used to decrypt if the recaptcha is correct.
      Should not be available publicly.
    type: string
  - name: recaptcha2ClientKey
    description: Secret which would be used for recaptcha2 on the client side. Can
      be publicly visible, and upon authenticating users it would be sent to front-end.
    type: string
  - name: enableTotp
    description: Enables user to make 2FA using apps such as google authenticator
      or microsoft authenticator.
    type: bool?
  - name: forceTotp
    description: Forces the user to setup a 2FA in order to access their account.
      Users which did not setup this won't be affected.
    type: bool?
  - name: forcePasswordOnPhone
    description: Forces users who want to create account using phone number to also
      set a password on their account
    type: bool?
  - name: forcePersonNameOnPhone
    description: Forces the creation of account using phone number to ask for user
      first name and last name
    type: bool?
  - name: generalEmailProviderId
    description: The unique-id of the email provider service, which will be used to
      send the messages using it's service.
    type: string?
  - name: generalGsmProviderId
    description: The unique-id of the general service which would be used to send
      text messages (sms).
    type: string?
