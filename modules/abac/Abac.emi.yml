  - name: publicJoinKey
    description: Joining to different workspaces using a public link directly
    fields:
      - name: roleId
        type: string?
        description: The unique-id of the role which is granted to anyone joining via this key.
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: emailConfirmation
    fields:
      - name: userId
        type: string?
        description: The unique-id of the user this confirmation belongs to.
      - name: status
        type: string
      - name: email
        type: string
      - name: key
        type: string
      - name: expiresAt
        type: string
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime


  - name: phoneConfirmation
    fields:
      - name: userId
        type: string?
        description: The unique-id of the user this confirmation belongs to.
      - name: status
        type: string
      - name: phoneNumber
        type: string
      - name: key
        type: string
      - name: expiresAt
        type: string
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: token
    fields:
      - name: userId
        type: string?
        description: The unique-id of the user this token belongs to.
      - name: token
        type: string
      - name: validUntil
        type: complex
        complex: XDateTime
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: workspaceInvite
    cliShort: invite
    description: >-
      Active invitations for non-users or already users to join an specific
      workspace, created by administration of the workspace
    fields:
      - name: publicKey
        type: string
        description:
          A long hash to get the user into the confirm or signup page without sending
          the email or phone number, for example if an administrator wants to copy the link.
      - name: coverLetter
        type: string
        description: The content that user will receive to understand the reason of the letter.
      - name: targetUserLocale
        type: string
        description:
          If the invited person has a different language, then you can define
          that so the interface for him will be automatically translated.
      - name: email
        type: string
        description: The email address of the person which is invited.
      - name: phonenumber
        type: string
        description: The phone number of the person which is invited.
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which user is being invited to.
      - name: firstName
        type: string
        tags:
          validate: required
        description: First name of the person which is invited
      - name: lastName
        tags:
          validate: required
        type: string
        description: Last name of the person which is invited.
      - name: forceEmailAddress
        type: bool?
        description: If forced, the email address cannot be changed by the user which has been invited.
      - name: forcePhoneNumber
        type: bool?
        description: If forced, user cannot change the phone number and needs to complete signup.
      - name: roleId
        type: string?
        description: The role which invitee get if they accept the request.
        tags:
          validate: required
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: userWorkspace
    cliShort: user
    description: >-
      Manage the workspaces that user belongs to (either its himselves or adding
      by invitation)
    gormMap:
      workspaceId: "index:userworkspace_idx,unique"
      userId: "index:userworkspace_idx,unique"
    fields:
      - name: userId
        type: string?
        description: The unique-id of the user this record belongs to.
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userPermissions
        type: slice
        primitive: string
        tags:
          gorm: "-"
          sql: "-"
      - name: rolePermission
        type: slice
        primitive: UserRoleWorkspaceDto
        tags:
          gorm: "-"
          sql: "-"
      - name: workspacePermissions
        type: slice
        primitive: string
        tags:
          gorm: "-"
          sql: "-"
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: workspaceRole
    cliShort: role
    description: >-
      Manage roles assigned to an specific workspace or created by the workspace
      itself
    fields:
      - name: userWorkspaceId
        type: string?
        description: The unique-id of the userWorkspace this role assignment belongs to.
        tags:
          gorm: "index:workspacerole_idx,unique"
      - name: roleId
        type: string?
        description: The unique-id of the assigned role.
        tags:
          gorm: "index:workspacerole_idx,unique"
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: regionalContent
    cliShort: rc
    description: >-
      Email templates, sms templates or other textual content which can be
      accessed.
    fields:
      - name: content
        type: string
        tags:
          validate: required
        description: >-
          The template body sent to the user - supports Go template syntax to
          insert dynamic values, such as {{.Otp}} for the one-time password.
      - name: region
        tags:
          validate: required
          # Region is part of the uniqueness together with languageId/keyGroup
          # below, so the same language+keyGroup can have a different variant
          # per region (e.g. "us" vs "eu") - without it here, only a single
          # region-less row could ever exist per language+keyGroup at all,
          # defeating the point of a "regional" content entity.
          gorm: "index:regional_content_index,unique"
        type: string
        description: >-
          Region or locale this content applies to, for example any, us, eu,
          or asia/*. Use any unless you need to target a specific region.
      - name: title
        type: string
        description: >-
          Optional subject line - only used for email-type content.
      - name: languageId
        tags:
          validate: required
          gorm: "index:regional_content_index,unique"
        type: string
        description: >-
          Language code this content is written in, for example en, fa, or
          pl. Falls back to English if nothing matches a user's language.
      - name: keyGroup
        tags:
          validate: required
          gorm: "index:regional_content_index,unique"
        type: enum
        description: Which kind of message this content is used for.
        of:
          - k: SMS_OTP
            description: Used when an sms would be sent with one time password
          - k: EMAIL_OTP
            description: Used when an email would be sent with one time password
          - k: INVITE_TO_WORKSPACE
            description: >-
              Used as the default template when a user invites a third-party
              into their own workspace
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: publicAuthentication
    cliShort: pa
    description:
      Keeps information about user onboarding, otp state, and other things
      which are necessary for onboarding new users in multiple endpoints
    fields:
      - name: userId
        type: string?
        description: The unique-id of the user which this record belongs to.
      - name: totpSecret
        type: string
        description:
          If the application requires totp dual factor upon account creation,
          we create a secret here and pass the link
      - name: totpLink
        type: string
        description: The url which will be converted into QR code on client side to scan
      - name: passportId
        type: string?
        description: The unique-id of the passport this record belongs to.
      - name: sessionSecret
        type: string
        description:
          This is a long hash generated and will be used to authenticate user after
          he confirmed the otp to finish the signup process and add more information
          before creating an account
      - name: passportValue
        type: string
      - name: isInCreationProcess
        type: bool?
      - name: status
        type: string
      - name: blockedUntil
        type: int64
      - name: otp
        type: string
      - name: recoveryAbsoluteUrl
        type: string
        tags:
          sql: "-"
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime


  - name: notificationConfig
    cliShort: config
    description: >-
      Configuration for the notifications used in the app, such as default
      gsm number, email senders, and many more
    fields:
      - name: cascadeToSubWorkspaces
        type: bool
      - name: forcedCascadeEmailProvider
        type: bool
      - name: generalEmailProviderId
        type: string?
      - name: generalGsmProviderId
        type: string?
      - name: inviteToWorkspaceContent
        type: string
        tags:
          gorm: text
      - name: inviteToWorkspaceContentExcerpt
        type: string
        tags:
          gorm: text
      - name: inviteToWorkspaceContentDefault
        type: string
        tags:
          gorm: text
          sql: "-"
      - name: inviteToWorkspaceContentDefaultExcerpt
        type: string
        tags:
          gorm: text
          sql: "-"
      - name: inviteToWorkspaceTitle
        type: string
      - name: inviteToWorkspaceTitleDefault
        type: string
        tags:
          sql: "-"
      - name: inviteToWorkspaceSenderId
        type: string?
      - name: accountCenterEmailSenderId
        type: string?
      - name: forgetPasswordContent
        type: string
        tags:
          gorm: text
      - name: forgetPasswordContentExcerpt
        type: string
        tags:
          gorm: text
      - name: forgetPasswordContentDefault
        type: string
        tags:
          gorm: text
          sql: "-"
      - name: forgetPasswordContentDefaultExcerpt
        type: string
        tags:
          gorm: text
          sql: "-"
      - name: forgetPasswordTitle
        type: string
        tags:
          gorm: text
      - name: forgetPasswordTitleDefault
        type: string
        tags:
          gorm: text
          sql: "-"
      - name: forgetPasswordSenderId
        type: string?
      - name: acceptLanguage
        type: string
      - name: confirmEmailSenderId
        type: string?
      - name: confirmEmailContent
        type: string
        tags:
          gorm: text
      - name: confirmEmailContentExcerpt
        type: string
        tags:
          gorm: text
      - name: confirmEmailContentDefault
        type: string
        tags:
          gorm: text
          sql: "-"
      - name: confirmEmailContentDefaultExcerpt
        type: string
        tags:
          gorm: text
          sql: "-"
      - name: confirmEmailTitle
        type: string
      - name: confirmEmailTitleDefault
        type: string
        tags:
          sql: "-"
      - name: workspaceId
        type: string?
      - name: userId
        type: string?
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
