  - name: workspaceConfig
    cliShort: config
    description: >-
      Contains configuration which would be necessary for application
      environment to be running. At the moment, a single record is allowed,
      and only for root workspace. But in theory it could be configured per
      each workspace independently. For sub projects do not touch this,
      rather create a custom config entity if workspaces in the product
      need extra config.
    fields:
      - name: enableRecaptcha2
        type: bool?
        description: Enables the recaptcha2 for authentication flow.
      - name: enableOtp
        type: bool?
        description: Enables the otp option. It's not forcing it, so user can choose if they want otp or password.
      - name: requireOtpOnSignup
        type: bool?
        description: >-
          Forces the user to have otp verification before can create an
          account. They can define their password still.
      - name: requireOtpOnSignin
        type: bool?
        description: >-
          Forces the user to use otp when signing in. Even if they have
          password set, they won't use it and only will be able to signin
          using that otp.
      - name: recaptcha2ServerKey
        type: string
        description: >-
          Secret which would be used to decrypt if the recaptcha is
          correct. Should not be available publicly.
      - name: recaptcha2ClientKey
        type: string
        description: >-
          Secret which would be used for recaptcha2 on the client side.
          Can be publicly visible, and upon authenticating users it would
          be sent to front-end.
      - name: enableTotp
        type: bool?
        description: Enables user to make 2FA using apps such as google authenticator or microsoft authenticator.
      - name: forceTotp
        type: bool?
        description: >-
          Forces the user to setup a 2FA in order to access their account.
          Users which did not setup this won't be affected.
      - name: forcePasswordOnPhone
        type: bool?
        description: >-
          Forces users who want to create account using phone number to
          also set a password on their account
      - name: forcePersonNameOnPhone
        type: bool?
        description: Forces the creation of account using phone number to ask for user first name and last name
      - name: generalEmailProviderId
        type: string?
        description: >-
          The unique-id of the email provider service, which will be used to
          send the messages using it's service.
      - name: generalGsmProviderId
        type: string?
        description: The unique-id of the general service which would be used to send text messages (sms).
      - name: inviteToWorkspaceContentId
        type: string?
        description: The unique-id of the template used as default when a user is inviting a third-party into their own workspace.
      - name: emailOtpContentId
        type: string?
        description: The unique-id of the template used to fill the message for email one-time-password requests.
      - name: smsOtpContentId
        type: string?
        description: The unique-id of the template used for OTP text messages, including the one time password code.
      - name: workspaceId
        type: string?
      - name: userId
        type: string?
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime


  - name: role
    description: Manage roles within the workspaces, or root configuration
    fields:
      - name: name
        type: string
        tags:
          validate: "required,omitempty,min=1,max=200"
      - name: capabilitiesListId
        type: complex
        complex: JSON
        description: >-
          The list of capability completeKeys granted to this role, stored
          directly as JSON (replaces the old many-to-many role_capabilities
          join table - Emi has no relation mechanism compatible with
          fireback's string-uniqueId FK convention, see other entities'
          xId fields).
      - name: isDeletable
        type: bool?
        tags:
          gorm: "default:true"
      - name: isUpdatable
        type: bool?
        tags:
          gorm: "default:true"
      - name: workspaceId
        type: string?
      - name: userId
        type: string?
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime


  - name: workspaceType
    cliShort: type
    description: >-
      Defines a type for workspace, and the role which it can have as a
      whole. In systems with multiple types of services, e.g. student,
      teachers, schools this is useful to set those default types and
      limit the access of the users.
    fields:
      - name: title
        type: string
        tags:
          validate: "required,omitempty,min=1,max=250"
      - name: description
        type: string
      - name: slug
        type: string
        description: >-
          Unique, URL-safe identifier for this workspace type. Must start
          with "/", contain only lowercase a-z and dashes after that, and be
          at most 50 characters long. Format is enforced in
          ValidateTheWorkspaceTypeEntity (WorkspaceTypeActions.go);
          gorm:"unique" here is the DB-level backstop for the uniqueness
          half of that.
        tags:
          validate: "required,omitempty,min=2,max=50"
          gorm: unique
      - name: roleId
        type: string
        tags:
          validate: required
        description: >-
          The role which will be used to define the functionality of this
          workspace. Role needs to be created before hand, and only roles
          which belong to root workspace are possible to be selected.
      - name: workspaceId
        type: string?
      - name: userId
        type: string?
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime


  - name: user
    description: Manage the users who are in the current app (root only)
    fields:
      - name: firstName
        type: string
        tags:
          validate: required
      - name: lastName
        type: string
        tags:
          validate: required
      - name: photo
        type: string
      - name: gender
        type: int?
      - name: title
        type: string
      - name: birthDate
        type: complex
        complex: XDate
      - name: avatar
        type: string
      - name: lastIpAddress
        type: string
        description: User last connecting ip address
      - name: primaryAddress
        type: object?
        description: >-
          User primary address location. Can be useful for simple projects
          that a user is associated with a single address.
        fields:
          - name: addressLine1
            type: string
            description: Street address, building number
          - name: addressLine2
            type: string?
            description: Apartment, suite, floor (optional)
          - name: city
            type: string?
            description: City or locality
          - name: stateOrProvince
            type: string?
            description: State, region, or province
          - name: postalCode
            type: string?
            description: ZIP or postal code
          - name: countryCode
            type: string?
            description: ISO 3166-1 alpha-2 (e.g., "US", "DE")
      - name: phoneNumber
        type: string?
        description: Contact phone number for this user (separate from any passport used to sign in).
      - name: jobTitle
        type: string?
        description: The user's job title/role, e.g. "Support Engineer".
      - name: company
        type: string?
        description: The company or organization the user is associated with.
      - name: bio
        type: string?
        description: Free-form biography/notes about the user.
        tags:
          gorm: text
      - name: userId
        type: string?
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime


  - name: workspace
    cliShort: ws
    description: Fireback general user role, workspaces services.
    fields:
      - name: description
        type: string
      - name: name
        type: string
        tags:
          validate: required
      - name: typeId
        type: string
        tags:
          validate: required
        description: The unique-id of the workspace type which defines this workspace's role.
      - name: parentId
        type: string?
        description: The unique-id of the parent workspace, for nested/tree workspaces.
      - name: workspaceId
        type: string?
      - name: userId
        type: string?
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime


  - name: passport
    description: >-
      Represent a mean to login in into the system, each user could have
      multiple passport (email, phone) and authenticate into the system.
    fields:
      - name: thirdPartyVerifier
        type: string
        description: >-
          When user creates account via oauth services such as google, it's
          essential to set the provider and do not allow passwordless logins
          if it's not via that specific provider.
      - name: type
        type: string
        tags:
          validate: required
      - name: userId
        type: string?
      - name: value
        type: string
        tags:
          validate: required
          gorm: unique
      - name: totpSecret
        type: string
        description: >-
          Store the secret of 2FA using time based dual factor authentication
          here for this specific passport. If set, during authorization will
          be asked.
      - name: totpConfirmed
        type: bool?
        description: >-
          Regardless of the secret, user needs to confirm his secret. There
          is an extra action to confirm user totp, could be used after
          signup or prior to login.
      - name: password
        type: string
        tags:
          json: "-"
          yaml: "-"
      - name: confirmed
        type: bool?
      - name: accessToken
        type: string
      - name: workspaceId
        type: string?
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: notification
    description: >-
      An in-app notification delivered to one specific user - created in bulk (one
      row per recipient) by the root-only SendNotification action, not by the
      generic per-entity create endpoint directly, so a notification always has a
      real recipient and, when sent by a person, a real sender.
    fields:
      - name: userId
        type: string
        tags:
          validate: required
        description: UniqueId of the user this notification was sent to.
      - name: senderId
        type: string?
        description: UniqueId of the (root) user who sent this notification.
      - name: title
        type: string
        tags:
          validate: required
        description: Short notification title.
      - name: body
        type: string
        tags:
          validate: required
        description: Notification message body.
      - name: isRead
        type: bool
        description: Whether the recipient has read this notification yet.
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime
