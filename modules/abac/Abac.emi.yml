complexes:
  - compiler: go
    location: github.com/torabian/fireback/modules/fireback/complexes
    name: JSON
    namespace: complexes
  - compiler: go
    location: github.com/torabian/fireback/modules/fireback/complexes
    name: XDate
    namespace: complexes
  - compiler: go
    location: github.com/torabian/fireback/modules/abac/abaccomplexes
    name: PlainTime
    namespace: abaccomplexes
  - compiler: go
    location: github.com/torabian/fireback/modules/fireback/complexes
    name: XDateTime
    namespace: complexes
  - compiler: go
    location: github.com/torabian/fireback/modules/fireback/complexes
    name: TString
    namespace: complexes
  - compiler: ts
    location: '@fireback/complexes'
    name: TString

targets:
  - compiler: go
    output: ./defs
    flags:
      pkg: abacdefs
    tags:
      - split-cli
      - split-gin
  # Generated straight into every ui/packages/* consumer that actually imports it
  # (see ui/packages/README.md) instead of a single shared @fireback/sdk - each one
  # ends up with its own copy, duplication is fine here.
  - compiler: js
    output: ../../ui/packages/ui-core/sdk/abac
    clean: true
    flags:
      js-sdk-location: "@fireback/js-remote-ctx"
    tags:
      - typescript
      - react
      - no-package
      - no-sdk
  - compiler: js
    output: ../../ui/packages/manage/sdk/abac
    clean: true
    flags:
      js-sdk-location: "@fireback/js-remote-ctx"
    tags:
      - typescript
      - react
      - no-package
      - no-sdk
  - compiler: js
    output: ../../ui/packages/selfservice/sdk/abac
    clean: true
    flags:
      js-sdk-location: "@fireback/js-remote-ctx"
    tags:
      - typescript
      - react
      - no-package
      - no-sdk
  - compiler: preprocessor
    output: ./

name: abac

config:
  - name: otpLockoutSeconds
    type: int64
    default: "120"
    description:
      How many seconds a passport value (email or phone) must wait before it can
      request another OTP/magic-link, once a request is already pending. See
      ClassicPassportRequestOtpActionImplementation.go.
  - name: selfServiceBaseUrl
    type: string
    default: "http://localhost:8888/selfservice/#"
    description:
      Base URL of the running self-service frontend (ui/packages/selfservice), used to
      build the recovery link sent by ClassicPassportRequestOtpActionImplementation.go
      and SendPassportResetEmailActionImplementation.go - the value gets
      /en/selfservice/reset-password?value=... appended directly, so include a
      trailing /# fragment here too if that frontend build uses a HashRouter
      (BUILD_VARIABLES.USE_HASH_ROUTER, the default for ui/src/apps/self-service). The
      default here matches this same binary's own embedded self-service build (see
      cmd/fireback/main.go's PublicFolders), mounted at /selfservice on this same
      origin - point this at wherever the self-service frontend is actually deployed
      in production, adjusting or omitting the /selfservice path segment and the /#
      fragment (HashRouter vs plain BrowserRouter) to match that deployment.

description:
  Fireback ABAC module provides user authentication, basic support for most projects,
  including advanced role, permission module on top of fireback core module.
  Using this module is not essential to create fireback projects, but provides a great
  possibility to avoid building most user management flow.
  Some other helpers, such as timezone are added here.

dtos:
  - name: userImport
    fields:
      - name: avatar
        type: string
      - name: passports
        type: array
        fields:
          - name: value
            type: string
          - name: password
            type: string
      - name: address
        type: object
        fields:
          - name: street
            type: string
          - name: zipCode
            type: string
          - name: city
            type: string
          - name: country
            type: string

  - name: okayResponse

  - name: resetEmail
    fields:
      - name: password
        type: string
  - name: phoneNumberAccountCreation
    fields:
      - name: phoneNumber
        type: string
  - name: emailAccountSignin
    fields:
      - name: email
        type: string
        tags:
          validate: required
      - name: password
        tags:
          validate: required
        type: string
  - name: classicAuth
    fields:
      - name: value
        type: string
        tags:
          validate: required
      - name: password
        type: string
        tags:
          validate: required
      - name: firstName
        type: string
        tags:
          validate: required
      - name: lastName
        type: string
        tags:
          validate: required
      - name: inviteId
        type: string
      - name: publicJoinKeyId
        type: string
      - name: workspaceTypeId
        type: string
  - name: assignRole
    fields:
      - name: roleId
        type: string
      - name: userId
        type: string
      - name: visibility
        type: string
      - name: updated
        type: int64
      - name: created
        type: int64
  - name: exchangeKeyInformation
    fields:
      - name: key
        type: string
      - name: visibility
        type: string
  - name: testMail
    fields:
      - name: senderId
        type: string
      - name: toName
        type: string
      - name: toEmail
        type: string
      - name: subject
        type: string
      - name: content
        type: string
  - name: importRequest
    fields:
      - name: file
        type: string
  - name: permissionInfo
    fields:
      - name: name
        type: string
      - name: description
        type: string
      - name: completeKey
        type: string
  - name: userRoleWorkspace
    fields:
      - name: roleId
        type: string
      - name: capabilities
        type: slice
        primitive: string
  - name: otpAuthenticate
    fields:
      - name: value
        type: string
        tags:
          validate: required
      - name: otp
        type: string
      - name: type
        type: string
        tags:
          validate: required
      - name: password
        type: string
        tags:
          validate: required
  - name: userSession
    fields:
      - name: passport
        type: one?
        target: PassportEntity
      - name: token
        type: string
      - name: exchangeKey
        type: string
      - name: userWorkspaces
        type: collection
        target: UserWorkspaceEntity
      - name: user
        type: one?
        target: UserEntity
      - name: userId
        type: string?
  - name: workspaceInvitation
    description: Workspace invitation has some common usage, so it's put here.
    fields:
      - name: publicKey
        type: string
        description:
          A long hash to get the user into the confirm or signup page without sending
          the email or phone number, for example if an administrator wants to copy the link.
      - name: coverLetter
        type: string
        description: The content that user will receive to understand the reason of the letter.
      - name: targetUserLocale
        type: string
        description:
          If the invited person has a different language, then you can define
          that so the interface for him will be automatically translated.
      - name: email
        type: string
        description: The email address of the person which is invited.
      - name: phonenumber
        type: string
        description: The phone number of the person which is invited.
      - name: workspace
        type: one
        target: WorkspaceEntity
        description: Workspace which user is being invite to.
      - name: firstName
        type: string
        tags:
          validate: required
        description: First name of the person which is invited
      - name: lastName
        tags:
          validate: required
        type: string
        description: Last name of the person which is invited.
      - name: forceEmailAddress
        type: bool?
        description: If forced, the email address cannot be changed by the user which has been invited.
      - name: forcePhoneNumber
        type: bool?
        description: If forced, user cannot change the phone number and needs to complete signup.
      - name: roleId
        type: string
        description: The role which invitee get if they accept the request.
        tags:
          validate: required
  - name: capabilityInfo
    description: Capability and permission level which is suitable for front-end application to interact...
    fields:
      - name: uniqueId
        type: string
      - name: name
        type: string
      - name: children
        type: collection
        target: self@

actions:
  - name: CapabilitiesTree
    cliName: treex
    url: /capabilitiesTree
    method: get
    description: dLists all of the capabilities in database as a array of string as root access
    out:
      envelope: GResponse
      fields:
        - name: capabilities
          type: collection
          target: CapabilityInfoDto
        - name: nested
          type: collection
          target: CapabilityInfoDto

  - name: QueryUserRoleWorkspaces
    method: get
    url: /urw/query
    cliName: urw
    description:
      Returns the workspaces that user belongs to, as well as his role in there,
      and the permissions for each role
    out:
      envelope: GResponse
      fields:
        - name: name
          type: string
        - name: capabilities
          type: slice
          description: Workspace level capabilities which are available
          primitive: string
        - name: uniqueId
          type: string
        - name: roles
          type: array
          fields:
            - name: name
              type: string
            - name: uniqueId
              type: string
            - name: capabilities
              type: slice
              description: Capabilities related to this role which are available
              primitive: string
  - name: Whoami
    method: get
    cliName: whoami
    url: /whoami
    description:
      Returns information about the currently authenticated user - their userId,
      and every workspace they belong to along with their role(s) and capabilities
      in each (the same UserRoleWorkspace shape QueryUserRoleWorkspaces returns).
    out:
      envelope: GResponse
      fields:
        - name: userId
          type: string
        - name: workspaces
          type: array
          fields:
            - name: name
              type: string
            - name: uniqueId
              type: string
            - name: capabilities
              type: slice
              description: Workspace level capabilities which are available
              primitive: string
            - name: roles
              type: array
              fields:
                - name: name
                  type: string
                - name: uniqueId
                  type: string
                - name: capabilities
                  type: slice
                  description: Capabilities related to this role which are available
                  primitive: string

  - name: InviteToWorkspace
    url: /workspace/invite
    cliName: invite
    method: post
    description: "Invite a new person (either a user, with passport or without passport)"
    in:
      dto: WorkspaceInvitationDto
    out:
      dto: WorkspaceInvitationDto

  - name: AddUserToWorkspace
    url: /workspace/add-user
    cliName: add-user
    method: post
    description:
      Adds an existing user directly to a workspace with one of that workspace's
      existing roles - no invitation/email involved, root only. Use InviteToWorkspace
      instead when the target person doesn't have an account yet.
    in:
      fields:
        - name: userId
          type: string
          tags:
            validate: required
          description: UniqueId of the existing user to add to the workspace.
        - name: workspaceId
          type: string
          tags:
            validate: required
          description: UniqueId of the workspace to add the user to.
        - name: roleId
          type: string
          tags:
            validate: required
          description: UniqueId of the role (must belong to workspaceId) to assign to the user.
    out:
      envelope: GResponse
      fields:
        - name: uniqueId
          type: string
          description: UniqueId of the created userWorkspace membership row.
        - name: userId
          type: string
        - name: workspaceId
          type: string
        - name: roleId
          type: string

  - name: RemoveUserFromWorkspace
    url: /workspace/remove-user
    cliName: remove-user
    method: post
    description:
      Removes an existing user's membership - and every role assignment they have
      in it - from a workspace, root only. The counterpart to AddUserToWorkspace.
    in:
      fields:
        - name: userId
          type: string
          tags:
            validate: required
          description: UniqueId of the user to remove.
        - name: workspaceId
          type: string
          tags:
            validate: required
          description: UniqueId of the workspace to remove the user from.
    out:
      envelope: GResponse
      fields:
        - name: uniqueId
          type: string
          description: UniqueId of the removed userWorkspace membership row.
        - name: userId
          type: string
        - name: workspaceId
          type: string

  - name: ChangeUserWorkspaceRole
    url: /workspace/change-user-role
    cliName: change-user-role
    method: post
    description:
      Replaces a user's role assignment(s) in a workspace with a single new role,
      root only. roleId must belong to workspaceId, not to root - list the real
      options with 'role browse' (or GET /role/browse) using a Workspace-Id header
      set to workspaceId, not root.
    in:
      fields:
        - name: userId
          type: string
          tags:
            validate: required
          description: UniqueId of the user whose role is changing. Must already be a member of workspaceId (see AddUserToWorkspace otherwise).
        - name: workspaceId
          type: string
          tags:
            validate: required
          description: UniqueId of the workspace the membership belongs to.
        - name: roleId
          type: string
          tags:
            validate: required
          description: UniqueId of the new role (must belong to workspaceId) to assign to the user.
    out:
      envelope: GResponse
      fields:
        - name: uniqueId
          type: string
          description: UniqueId of the userWorkspace membership row.
        - name: userId
          type: string
        - name: workspaceId
          type: string
        - name: roleId
          type: string

  - name: QueryWorkspaceRoles
    url: /workspace/roles
    cliName: workspace-roles
    method: post
    description:
      Lists the roles that actually belong to a given workspace - root only, and
      deliberately bypasses the normal per-workspace capability check the generic
      'role browse'/GET /role/browse endpoint enforces (root has no real membership
      in most workspaces, so switching Workspace-Id to one it doesn't belong to
      would otherwise 401 there). Use this - not root's own role list - to populate
      a role picker for AddUserToWorkspace/ChangeUserWorkspaceRole.
    in:
      fields:
        - name: workspaceId
          type: string
          tags:
            validate: required
          description: UniqueId of the workspace whose roles to list.
    out:
      envelope: GResponse
      fields:
        - name: uniqueId
          type: string
        - name: name
          type: string
        - name: capabilitiesListId
          type: slice
          primitive: string

  - name: CreatePassportForUser
    url: /passport/create-for-user
    cliName: create-for-user
    method: post
    description:
      Creates a new email or phone passport for an existing user with a password
      already set, and marks it confirmed - for an admin manually provisioning a
      login when the user can't complete the normal signup/verification flow
      themselves. Root only. The generic 'passport create' endpoint can't do this -
      PassportEntity's password field is deliberately write-only from JSON
      (json:"-"), by design, everywhere except here and SetPassportPassword.
    in:
      fields:
        - name: userId
          type: string
          tags:
            validate: required
          description: UniqueId of the existing user to create the passport for.
        - name: type
          type: string
          tags:
            validate: required
          description: "The passport method: 'email' or 'phone'."
        - name: value
          type: string
          tags:
            validate: required
          description: The email address or phone number for this passport. Must be globally unique across every passport.
        - name: password
          type: string
          tags:
            validate: required
          description: Plaintext password to set on the new passport (minimum 6 characters) - hashed before it's stored, never returned.
    out:
      envelope: GResponse
      fields:
        - name: uniqueId
          type: string
        - name: userId
          type: string
        - name: type
          type: string
        - name: value
          type: string

  - name: UserInvitations
    description:
      Shows the invitations for an specific user, if the invited member already has a account.
      It's based on the passports, so if the passport is authenticated we will show them.
    url: /users/invitations
    method: get
    out:
      envelope: GResponse
      fields:
        - name: userId
          type: string
          description: UserUniqueId
        - name: uniqueId
          type: string
          description: Invitation unique id
        - name: value
          type: string
          description: The value of the passport (email/phone)
        - name: roleName
          type: string
          description: Name of the role that user will get
        - name: workspaceName
          type: string
          description: Name of the workspace which user is invited to.
        - name: type
          type: string
          description: The method of the invitation, such as email.
        - name: coverLetter
          type: string
          description: The content that user will receive to understand the reason of the letter.

  - name: Signout
    url: /passport/signout
    description: Signout the user, clears cookies or does anything else if needed.
    method: post
    in:
      fields:
        - name: clear
          type: bool?
    out:
      envelope: GResponse
      fields:
        - name: okay
          type: bool

  - name: OauthAuthenticate
    description: When a token is got from a oauth service such as google,
      we send the token here to authenticate the user.
      To me seems this doesn't need to have 2FA or anything, so we return
      the session directly, or maybe there needs to be next step.
    url: /passport/via-oauth
    method: post
    in:
      fields:
        - name: token
          type: string
          description:
            The token that Auth2 provider returned to the front-end, which will
            be used to validate the backend
        - name: service
          type: string
          description:
            The service name, such as 'google' which later backend will use to authorize the token
            and create the user.
    out:
      envelope: GResponse
      fields:
        - name: session
          type: one
          target: UserSessionDto
        - name: next
          type: slice
          primitive: string
          description: The next possible action which is suggested.

  - name: AcceptInvite
    method: post
    url: /user/invitation/accept
    description: Use it when user accepts an invitation, and it will complete the joining process
    out:
      envelope: GResponse
      fields:
        - name: accepted
          type: bool
    in:
      fields:
        - name: invitationUniqueId
          type: string
          tags:
            validate: required
          description: The invitation id which will be used to process

  - name: ConfirmClassicPassportTotp
    description:
      When user requires to setup the totp for an specifc passport, they can use this endpoint to confirm
      it.
    method: post
    url: /passport/totp/confirm
    in:
      fields:
        - name: value
          type: string
          tags:
            validate: required
          description: Passport value, email or phone number which is already successfully registered.
        - name: password
          type: string
          tags:
            validate: required
          description:
            Password related to the passport. Totp is only available for passports with a password.
            Basically totp is protecting passport, not otp over email or sms.
        - name: totpCode
          type: string
          tags:
            validate: required
          description: The totp code generated by authenticator such as google or microsft apps.
    out:
      envelope: GResponse
      fields:
        - name: session
          type: one
          target: UserSessionDto
  - name: ChangePassword
    url: /passport/change-password
    description:
      Change the password for a given passport of the user. User needs to be authenticated in
      order to be able to change the password for a given account.
    cliName: cp
    method: post
    out:
      envelope: GResponse
      fields:
        - name: changed
          type: bool
    in:
      fields:
        - name: password
          type: string
          description: New password meeting the security requirements.
          tags:
            validate: required
        - name: uniqueId
          tags:
            validate: required
          description:
            The passport uniqueId (not the email or phone number) which password would be applied to.
            Don't confuse with value.
          type: string

  - name: SetPassportPassword
    url: /passport/set-password
    description:
      Root-only. Directly sets a new password on any passport, without knowing (or
      being) the current one - unlike ChangePassword, which only ever touches the
      calling user's own passport. Meant for an administrator resetting a locked-out
      user's password on their behalf.
    cliName: set-password
    method: post
    out:
      envelope: GResponse
      fields:
        - name: changed
          type: bool
    in:
      fields:
        - name: uniqueId
          tags:
            validate: required
          description: The passport uniqueId whose password will be replaced.
          type: string
        - name: password
          type: string
          description: New password meeting the security requirements.
          tags:
            validate: required

  - name: DisablePassportTotp
    url: /passport/totp/disable
    description:
      Root-only. Force-disables TOTP (2FA) on a passport by clearing its secret and
      confirmation flag - for unblocking a user who lost their authenticator device.
      There is no matching "enable" action, since turning TOTP on requires the user's
      own authenticator app to scan a fresh secret (see ConfirmClassicPassportTotpAction),
      which an administrator cannot do on their behalf.
    cliName: disable-totp
    method: post
    out:
      envelope: GResponse
      fields:
        - name: disabled
          type: bool
    in:
      fields:
        - name: uniqueId
          tags:
            validate: required
          description: The passport uniqueId to disable TOTP for.
          type: string

  - name: SendPassportResetEmail
    url: /passport/send-reset-email
    description:
      Root-only. Sends the same OTP/recovery email or SMS ClassicPassportRequestOtp
      sends for self-service login, but triggered by an administrator on the user's
      behalf and addressed by passport uniqueId instead of by value - lets an admin
      hand a locked-out user a way to reset their own password rather than the admin
      setting it directly (see SetPassportPassword for that alternative).
    cliName: send-reset-email
    method: post
    out:
      envelope: GResponse
      fields:
        - name: sent
          type: bool
    in:
      fields:
        - name: uniqueId
          tags:
            validate: required
          description: The passport uniqueId to send the reset email/SMS to.
          type: string

  - name: CompletePassportPasswordReset
    url: /passport/reset-password
    description:
      Public. Finishes the self-service reset flow started by ClassicPassportRequestOtp
      or SendPassportResetEmail - given the passport value and the OTP code that was
      emailed/texted to it, sets a new password and signs the user in, the same way a
      successful ClassicPassportOtp login would.
    cliName: reset-password
    method: post
    out:
      envelope: GResponse
      fields:
        - name: reset
          type: bool
        - name: session
          type: one?
          target: UserSessionDto
    in:
      fields:
        - name: value
          type: string
          tags:
            validate: required
          description: Passport value (email, phone number) the OTP was sent to.
        - name: otp
          type: string
          tags:
            validate: required
          description: The OTP code emailed/texted to the passport value.
        - name: password
          type: string
          tags:
            validate: required
          description: New password meeting the security requirements.

  - name: UserPassports
    url: /user/passports
    description: Returns list of passports belongs to an specific user.
    method: get
    out:
      envelope: GResponse
      fields:
        - name: value
          type: string
          description: The passport value, such as email address or phone number
        - name: uniqueId
          type: string
          description: Unique identifier of the passport to operate some action on top of it
        - name: type
          type: string
          description: The type of the passport, such as email, phone number
        - name: totpConfirmed
          type: bool
          description:
            Regardless of the secret, user needs to confirm his secret. There is an extra action
            to confirm user totp, could be used after signup or prior to login.
  - name: CreateWorkspace
    method: post
    url: /workspaces/create
    in:
      fields:
        - name: name
          type: string
    out:
      envelope: GResponse
      fields:
        - name: workspaceId
          type: string

  - name: ClassicPassportRequestOtp
    description: >-
      Triggers an otp request, and will send an sms or email to the passport.
      This endpoint is not used for login, but rather makes a request at initial
      step. Later you can call classicPassportOtp to get in.
    method: post
    cliName: otp-request
    url: /workspace/passport/request-otp
    in:
      fields:
        - name: value
          type: string
          tags:
            validate: required
          description: Passport value (email, phone number) which would be receiving the otp code.
    out:
      envelope: GResponse
      fields:
        - name: suspendUntil
          type: int64
        - name: validUntil
          type: int64
        - name: blockedUntil
          type: int64
        - name: secondsToUnblock
          type: int64
          description: The amount of time left to unblock for next request

  - name: ClassicPassportOtp
    description: >-
      Authenticate the user publicly for classic methods using communication
      service, such as sms, call, or email. You need to call classicPassportRequestOtp
      beforehand to send a otp code, and then validate it with this API.
      Also checkClassicPassport action might already sent the otp, so make sure you don't
      send it twice.
    method: post
    cliName: otp
    url: /workspace/passport/otp
    in:
      fields:
        - name: value
          type: string
          tags:
            validate: required
        - name: otp
          tags:
            validate: required
          type: string
    out:
      envelope: GResponse
      fields:
        - name: session
          type: one?
          target: UserSessionDto
          description:
            Upon successful authentication, there will be a session dto generated,
            which is a ground information of authorized user and can be stored in front-end.
        - name: totpUrl
          type: string
          description: If time based otp is available, we add it response to make it easier for ui.
        - name: sessionSecret
          type: string
          description: The session secret will be used to call complete user registration api.
        - name: continueWithCreation
          type: bool
          description:
            If return true, means the OTP is correct and user needs to be created
            before continue the authentication process.
  - name: CheckClassicPassport
    method: post
    cliName: ccp
    description: >-
      Checks if a classic passport (email, phone) exists or not, used in multi
      step authentication
    url: /workspace/passport/check
    in:
      fields:
        - name: value
          type: string
          tags:
            validate: required
        - name: securityToken
          type: string
          description:
            This can be the value of ReCaptcha2, ReCaptcha3, or generate security image or voice
            for verification. Will be used based on the configuration.
    out:
      envelope: GResponse
      fields:
        - name: next
          type: slice
          primitive: string
          description: The next possible action which is suggested.
        - name: flags
          type: slice
          primitive: string
          description:
            Extra information that can be useful actually when doing onboarding.
            Make sure sensitive information doesn't go out.
        - name: otpInfo
          type: object?
          description:
            If the endpoint automatically triggers a send otp, then it would be holding that information,
            Also the otp information can become available.
          fields:
            - name: suspendUntil
              type: int64
            - name: validUntil
              type: int64
            - name: blockedUntil
              type: int64
            - name: secondsToUnblock
              type: int64
              description: The amount of time left to unblock for next request
  - name: ClassicSignup
    url: /passports/signup/classic
    cliName: up
    description: >-
      Signup a user into system via public access (aka website visitors) using
      either email or phone number.
    method: post
    in:
      fields:
        - name: value
          tags:
            validate: required
          type: string
        - name: sessionSecret
          type: string
          description:
            Required when the account creation requires recaptcha, or otp approval
            first. If such requirements are there, you first need to follow the otp
            apis, get the session secret and pass it here to complete the setup.
        - name: type
          type: enum
          of:
            - k: phonenumber
            - k: email
          tags:
            validate: required
        - name: password
          type: string
          tags:
            validate: required
        - name: firstName
          type: string
          tags:
            validate: required
        - name: lastName
          type: string
          tags:
            validate: required
        - name: inviteId
          type: string?
        - name: publicJoinKeyId
          type: string?
        - name: workspaceTypeId
          type: string?
          tags:
            validate: required
    out:
      envelope: GResponse
      fields:
        - name: session
          type: one
          target: UserSessionDto
          description: Returns the user session in case that signup is completely successful.
        - name: totpUrl
          type: string
          description: If time based otp is available, we add it response to make it easier for ui.
        - name: continueToTotp
          type: bool
          description:
            Returns true and session will be empty if, the totp is required by the installation.
            In such scenario, you need to forward user to setup totp screen.
        - name: forcedTotp
          type: bool
          description:
            Determines if user must complete totp in order to continue based on workspace
            or installation

  - name: ClassicSignin
    url: /passports/signin/classic
    cliName: in
    description: "Signin publicly to and account using class passports (email, password)"
    method: post
    in:
      fields:
        - name: value
          type: string
          tags:
            validate: required
        - name: password
          type: string
          tags:
            validate: required
        - name: totpCode
          type: string
          description:
            Accepts login with totp code. If enabled, first login would return a success response
            with next[enter-totp] value and ui can understand that user needs to be navigated
            into the screen other screen.
        - name: sessionSecret
          type: string
          description:
            Session secret when logging in to the application requires
            more steps to complete.
    out:
      envelope: GResponse
      fields:
        - name: session
          type: one
          target: UserSessionDto
        - name: next
          type: slice
          primitive: string
          description: The next possible action which is suggested.
        - name: totpUrl
          type: string
          description:
            In case the account doesn't have totp, but enforced by installation,
            this value will contain the link
        - name: sessionSecret
          type: string
          description: Returns a secret session if the authentication requires more steps.
  - name: QueryWorkspaceTypesPublicly
    method: get
    url: /workspace/public/types
    cliName: public-types
    description:
      Returns the workspaces types available in the project publicly without authentication,
      and the value could be used upon signup to go different route.
    out:
      envelope: GResponse
      fields:
        - name: title
          type: string
        - name: description
          type: string
        - name: uniqueId
          type: string
        - name: slug
          type: string
  - name: CheckPassportMethods
    url: /passports/available-methods
    cliName: check-passport-methods
    description:
      Publicly available information to create the authentication form, and show users
      how they can signin or signup to the system. Based on the PassportMethod entities,
      it will compute the available methods for the user, considering their region (IP for example)
    method: get
    out:
      envelope: GResponse
      fields:
        - name: email
          type: bool
          default: false
        - name: phone
          type: bool
          default: false
        - name: google
          type: bool
          default: false
        - name: facebook
          type: bool
          default: false
        - name: googleOAuthClientKey
          type: string
        - name: facebookAppId
          type: string
        - name: enabledRecaptcha2
          type: bool
          default: false
        - name: recaptcha2ClientKey
          type: string
  - name: OsLoginAuthenticate
    method: get
    url: /passports/os/login
    cliName: oslogin
    description:
      Logins into the system using operating system (current) user, and store the information
      for them. Useful for desktop applications.
    out:
      dto: UserSessionDto

  - name: GsmSendSms
    url: /gsm/send/sms
    cliName: sms
    method: post
    description: Send a text message using default root notification configuration
    in:
      fields:
        - name: toNumber
          tags:
            validate: required
          type: string
        - name: body
          tags:
            validate: required
          type: string
    out:
      fields:
        - name: queueId
          type: string
  - name: WorkspaceConfigDistinctGet
    url: /workspace-config/distinct
    cliName: workspace-config-distinct-get
    method: get
    description: >-
      Returns the single WorkspaceConfig row for the caller's current workspace,
      looked up by workspace instead of uniqueId - if none exists yet, returns an
      empty WorkspaceConfig instead of a 404. Restores the old Module3-generated
      GET /workspace-config/distinct route.
    out:
      dto: WorkspaceConfigDto
      envelope: GResponse

  - name: WorkspaceConfigDistinctUpdate
    url: /workspace-config/distinct
    cliName: workspace-config-distinct-update
    method: patch
    description: >-
      Creates or updates the single WorkspaceConfig row for the caller's current
      workspace, resolved/written by workspace instead of a uniqueId path param.
      Restores the old Module3-generated PATCH /workspace-config/distinct route.
    in:
      dto: WorkspaceConfigOptionalDto
    out:
      dto: WorkspaceConfigDto
      envelope: GResponse

  - name: SendNotification
    url: /notification/send
    cliName: send
    method: post
    description:
      Root-only. Sends a notification to one or more existing users at once -
      creates one NotificationEntity row per userId (all sharing the same
      title/body/senderId), rather than requiring one call per recipient. Any
      userId that doesn't correspond to an existing user is skipped (not a hard
      failure for the whole batch) and reported back in skippedUserIds.
    in:
      fields:
        - name: userIds
          type: slice
          primitive: string
          tags:
            validate: required
          description: UniqueIds of the existing users to notify.
        - name: title
          type: string
          tags:
            validate: required
          description: Short notification title.
        - name: body
          type: string
          tags:
            validate: required
          description: Notification message body.
    out:
      envelope: GResponse
      fields:
        - name: sentCount
          type: int64
          description: Number of notifications actually created.
        - name: skippedUserIds
          type: slice
          primitive: string
          description: userIds skipped because no matching user exists.

  - name: MyNotifications
    url: /notification/mine
    cliName: mine
    method: get
    description:
      Self-service. Lists the calling user's own notifications (whichever workspace
      they're currently in - notifications aren't workspace-scoped from the
      recipient's side), most recent first. See SendNotificationAction for how
      they're created and MarkNotificationReadAction to mark one read.
    out:
      envelope: GResponse
      fields:
        - name: uniqueId
          type: string
        - name: title
          type: string
        - name: body
          type: string
        - name: isRead
          type: bool
        - name: createdAt
          type: string
          description: RFC3339 timestamp this notification was sent at.

  - name: MarkNotificationRead
    url: /notification/mark-read
    cliName: mark-read
    method: post
    description:
      Self-service. Marks one of the calling user's own notifications as read.
      404s (ResourceNotFound, not a permission error) if the given uniqueId
      doesn't belong to the caller - never lets a user learn whether some other
      uniqueId exists at all, let alone mark it read.
    in:
      fields:
        - name: uniqueId
          type: string
          tags:
            validate: required
          description: The notification uniqueId to mark as read.
    out:
      envelope: GResponse

  - name: AnalyticsOverview
    url: /analytics/overview
    cliName: overview
    method: get
    description:
      Root-only. Aggregate stats across users/workspaces/passports/roles/sessions -
      a fixed set of headline numbers (items, same key/label/category/value/rawValue/
      unit/severity shape InternalStatsSnapshot uses, so the UI can reuse the same
      stat-tile renderer) plus a handful of named chart datasets (series - monthly
      trends and categorical breakdowns) for the chart section below them. See
      AnalyticsActionImplementation.go for exactly what's measured and why.
    out:
      envelope: GResponse
      fields:
        - name: generatedAt
          type: string
          description: RFC3339 timestamp this snapshot was computed at.
        - name: items
          type: array
          description: Headline stats, in a stable display order (grouped by category).
          fields:
            - name: key
              type: string
              description: Stable machine-readable identifier, e.g. users.total.
            - name: label
              type: string
              description: Human-readable label for display, e.g. Total Users.
            - name: category
              type: string
              description: Display grouping, e.g. Users, Workspaces, Access, Engagement.
            - name: value
              type: string
              description: Pre-formatted display value, e.g. 128 or 42.3%.
            - name: rawValue
              type: float64
              description: The same value as a plain number, for programmatic use.
            - name: unit
              type: string
              description: Unit of rawValue, e.g. count, percent. Empty for non-numeric stats.
            - name: severity
              type: string
              description: One of ok, warn, critical, info - a coarse threshold-based read on this stat.
        - name: series
          type: array
          description: Named chart datasets (monthly trends, categorical breakdowns) for the chart section.
          fields:
            - name: key
              type: string
              description: Stable machine-readable identifier, e.g. users.monthlySignups.
            - name: label
              type: string
              description: Human-readable chart title.
            - name: category
              type: string
              description: Display grouping, matching items' own category values where related.
            - name: chartType
              type: string
              description: "One of 'line', 'bar' - a hint for which mark the UI should use."
            - name: unit
              type: string
              description: Unit of each point's value, e.g. count, percent.
            - name: points
              type: array
              description: Ordered data points - for time series, oldest first.
              fields:
                - name: label
                  type: string
                  description: X-axis label, e.g. "2026-03" for a month bucket, or a category name.
                - name: value
                  type: float64
entities:
  - name: capability
    cliShort: cap
    description: >-
      Manage the capabilities inside the application, both builtin to core and
      custom defined ones
    fields:
      - name: name
        type: string
      - name: description
        type: string

  - name: passportMethod
    cliShort: method
    description: >-
      Login/Signup methods which are available in the app for different regions
      (Email, Phone Number, Google, etc)
    fields:
      - name: type
        type: enum
        tags:
          validate: "oneof=email phone google facebook,required"
        of:
          - k: email
            description: Authenticate users using email
          - k: phone
            description: Authenticat users using phone number, can be sms, calls, or whatsapp.
          - k: google
            description: Users can be authenticated using their google account
          - k: facebook
            description: Users can be authenticated using their facebook account
      - name: region
        type: enum
        default: global
        description:
          The region which would be using this method of passports for authentication.
          In Fireback open-source, only 'global' is available.
        of:
          - k: global
        tags:
          validate: "required,oneof=global"
      - name: clientKey
        type: string
        description: Client key for those methods such as 'google' which require oauth client key
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: pendingWorkspaceInvite
    fields:
      - name: value
        type: string
      - name: type
        type: string
      - name: coverLetter
        type: string
      - name: workspaceName
        type: string
      - name: roleId
        type: string?
        description: The unique-id of the role which invitee will get if they accept the request.
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: preference
    fields:
      - name: timezone
        type: string
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: userProfile
    fields:
      - name: firstName
        type: string
      - name: lastName
        type: string
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
