entities:
- name: gsmProvider
  fields:
  - name: apiKey
    type: string
  - name: mainSenderNumber
    type: string
    tags:
      validate: required
  - name: type
    type: enum
    of:
    - k: url
    - k: terminal
    - k: mediana
    tags:
      validate: required
  - name: invokeUrl
    type: string
  - name: invokeBody
    type: string
  - name: workspaceId
    description: The unique-id of the workspace which content belongs to.
    type: string?
  - name: userId
    description: The unique-id of the user which created/owns the record.
    type: string?
  - name: createdAt
    type: complex
    complex: PlainTime
  - name: updatedAt
    type: complex
    complex: PlainTime
- name: emailProvider
  fields:
  - name: type
    description: Type of the service, or communication which actually is being used
      under the hood for providing the service, such as third party or printing right
      away for terminal or logs.
    type: enum
    of:
    - k: sendgrid
    - k: mailgun
    - k: postmark
    - k: resend
    - k: smtp
    - k: terminal
    tags:
      validate: required
  - name: title
    description: Give the email provider configuration a name, which makes it easier
      later to query.
    type: string
  - name: config
    description: JSON field which contains api keys, or other kind of configuration
      based on the type of the email provider.
    type: complex
    complex: JSON
  - name: workspaceId
    description: The unique-id of the workspace which content belongs to.
    type: string?
  - name: userId
    description: The unique-id of the user which created/owns the record.
    type: string?
  - name: createdAt
    type: complex
    complex: PlainTime
  - name: updatedAt
    type: complex
    complex: PlainTime
  description: Email servers and thirdparty services configuration to send emails
    across the app. Each configuration can be used for a different purpose, hence
    information is stored in database to give operation chance change the mail services
    without taking the server down.
- name: emailSender
  fields:
  - name: fromName
    type: string
    tags:
      validate: required
  - name: fromEmailAddress
    type: string
    tags:
      gorm: unique
      validate: required
  - name: replyTo
    type: string
    tags:
      validate: required
  - name: nickName
    type: string
    tags:
      validate: required
  - name: workspaceId
    description: The unique-id of the workspace which content belongs to.
    type: string?
  - name: userId
    description: The unique-id of the user which created/owns the record.
    type: string?
  - name: createdAt
    type: complex
    complex: PlainTime
  - name: updatedAt
    type: complex
    complex: PlainTime
  description: All emails going from the system need to have a virtual sender (nick
    name, email address, etc)
- name: webPushConfig
  fields:
  - name: subscription
    description: The json content of the web push after getting it from browser
    type: complex
    complex: JSON
    tags:
      validate: required
  - name: workspaceId
    description: The unique-id of the workspace which content belongs to.
    type: string?
  - name: userId
    description: The unique-id of the user which created/owns the record.
    type: string?
  - name: createdAt
    type: complex
    complex: PlainTime
  - name: updatedAt
    type: complex
    complex: PlainTime
  description: Keeps a browser's web-push subscription for the user who registered
    it.
complexes:
- name: JSON
  namespace: complexes
  location: github.com/torabian/fireback/modules/fireback/complexes
  compiler: go
- name: PlainTime
  namespace: abaccomplexes
  location: github.com/torabian/fireback/modules/abac/abaccomplexes
  compiler: go
actions:
- name: SendEmail
  cliName: email
  url: /email/send
  method: post
  description: Send a email using default root notification configuration
  in:
    fields:
    - name: providerId
      description: Sending a test email requires to be sent through an specific email
        provider.
      type: string
    - name: toAddress
      type: string
      tags:
        validate: required
    - name: body
      type: string
      tags:
        validate: required
  out:
    fields:
    - name: queueId
      type: string
- name: SendEmailWithProvider
  cliName: emailp
  url: /emailProvider/send
  method: post
  description: Send a text message using an specific gsm provider
  in:
    fields:
    - name: emailProvider
      type: one
      target: EmailProviderEntity
    - name: toAddress
      type: string
      tags:
        validate: required
    - name: body
      type: string
      tags:
        validate: required
  out:
    fields:
    - name: queueId
      type: string
- name: GsmSendSmsWithProvider
  cliName: smsp
  url: /gsmProvider/send/sms
  method: post
  description: Send a text message using an specific gsm provider
  in:
    fields:
    - name: gsmProviderId
      type: string
    - name: toNumber
      type: string
      tags:
        validate: required
    - name: body
      type: string
      tags:
        validate: required
  out:
    fields:
    - name: queueId
      type: string
- name: gsmProviderCreate
  cliShort: gsmProvider-c
  url: /gsmProvider
  method: post
  description: Creates a new "gsmProvider" row.
  in:
    dto: GsmProviderDto
  out:
    envelope: GResponse
    dto: GsmProviderDto
- name: gsmProviderUpdate
  cliShort: gsmProvider-u
  url: /gsmProvider/:uniqueId
  method: patch
  description: Applies a partial update to a "gsmProvider" row by uniqueId.
  in:
    dto: GsmProviderOptionalDto
  out:
    envelope: GResponse
    dto: GsmProviderDto
- name: gsmProviderGet
  cliShort: gsmProvider-g
  url: /gsmProvider/:uniqueId
  method: get
  description: Looks up a single "gsmProvider" row by uniqueId.
  out:
    envelope: GResponse
    dto: GsmProviderDto
- name: gsmProviderBrowse
  cliShort: gsmProvider-b
  url: /gsmProvider/browse
  method: get
  qs:
  - name: filter
    type: string
  - name: sort
    type: string
  - name: startIndex
    type: int
  - name: itemsPerPage
    type: int
  - name: cursor
    type: string
  description: Returns "gsmProvider" rows matching a filter, sorted/paged (see emigorm.ApplyQueryFilter/ApplyQueryScope).
  out:
    envelope: GResponse
    dto: GsmProviderOptionalDto
- name: gsmProviderAwareDeletePreview
  cliShort: gsmProvider-dp
  url: /gsmProvider/delete-preview
  method: get
  qs:
  - name: uniqueIds
    type: slice
    primitive: string
  description: Reports what deleting the given "gsmProvider" uniqueIds would affect,
    without deleting anything.
  out:
    envelope: GResponse
    fields:
    - name: message
      type: string
    - name: affected
      type: array
      fields:
      - name: relation
        type: string
      - name: count
        type: int64
- name: gsmProviderAwareDelete
  cliShort: gsmProvider-d
  url: /gsmProvider/delete
  method: post
  description: Deletes the given "gsmProvider" uniqueIds, along with everything gsmProviderAwareDeletePreview
    reports.
  in:
    fields:
    - name: uniqueIds
      type: slice
      primitive: string
