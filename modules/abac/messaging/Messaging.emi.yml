complexes:
  - compiler: go
    location: github.com/torabian/fireback/modules/fireback/complexes
    name: JSON
    namespace: complexes
  - compiler: go
    location: github.com/torabian/fireback/modules/abac/abaccomplexes
    name: PlainTime
    namespace: abaccomplexes

targets:
  - compiler: go
    output: ./defs
    flags:
      pkg: messagingdefs
  # Generated straight into every ui/packages/* consumer that actually imports it
  # (see ui/packages/README.md) instead of a single shared @fireback/sdk - each one
  # ends up with its own copy, duplication is fine here.
  - compiler: js
    output: ../../../ui/packages/ui-core/sdk/messaging
    clean: true
    flags:
      js-sdk-location: "@fireback/js-remote-ctx"
    tags:
      - typescript
      - react
      - no-package
      - no-sdk
  - compiler: js
    output: ../../../ui/packages/manage/sdk/messaging
    clean: true
    flags:
      js-sdk-location: "@fireback/js-remote-ctx"
    tags:
      - typescript
      - react
      - no-package
      - no-sdk
  - compiler: js
    output: ../../../ui/packages/selfservice/sdk/messaging
    clean: true
    flags:
      js-sdk-location: "@fireback/js-remote-ctx"
    tags:
      - typescript
      - react
      - no-package
      - no-sdk
  - compiler: js
    output: ../../../ui/packages/messaging/sdk/messaging
    clean: true
    flags:
      js-sdk-location: "@fireback/js-remote-ctx"
    tags:
      - typescript
      - react
      - no-package
      - no-sdk
  - compiler: preprocessor
    output: ./

name: messaging
description:
  Email and SMS/GSM provider configuration and sending mechanics, split out of abac's
  notification module - email providers (sendgrid/mailgun/postmark/resend/smtp/terminal),
  sms gateways (url/terminal/mediana), named "from" email senders, and per-user browser
  web-push subscriptions (webPushConfig, moved here from modules/fireback). Depends on
  abac for auth (ResolveActionContext/SecurityModel), but nothing in abac's other
  entities depends back on this module - see modules/abac/NotificationConfigActions.go
  for the one place abac calls into this package (looking up which provider is "the
  general one" for a workspace).

actions:
  - name: MessagingConfigGet
    url: /messaging/config
    cliName: get
    method: get
    description: >-
      Returns the single, global MessagingConfig row (there is exactly one for the
      whole installation, not one per workspace) - if none exists yet, returns an
      empty MessagingConfig instead of a 404.
    out:
      dto: MessagingConfigDto
      envelope: GResponse

  - name: MessagingConfigUpdate
    url: /messaging/config
    cliName: update
    method: patch
    description: >-
      Creates or updates the single, global MessagingConfig row (there is exactly
      one for the whole installation, not one per workspace) - the row is created
      on first write if it doesn't exist yet.
    in:
      dto: MessagingConfigOptionalDto
    out:
      dto: MessagingConfigDto
      envelope: GResponse

  - name: SendEmail
    url: /email/send
    cliName: email
    method: post
    description: Send a email using default root notification configuration
    in:
      fields:
        - name: providerId
          type: string
          description:
            Sending a test email requires to be sent through an specific email provider.
        - name: toAddress
          tags:
            validate: required
          type: string
        - name: body
          tags:
            validate: required
          type: string
    out:
      fields:
        - name: queueId
          type: string
  - name: SendEmailWithProvider
    url: /emailProvider/send
    cliName: emailp
    method: post
    description: Send a text message using an specific gsm provider
    in:
      fields:
        - name: emailProvider
          type: one
          target: EmailProviderEntity
        - name: toAddress
          tags:
            validate: required
          type: string
        - name: body
          tags:
            validate: required
          type: string
    out:
      fields:
        - name: queueId
          type: string
  - name: GsmSendSmsWithProvider
    url: /gsmProvider/send/sms
    cliName: smsp
    method: post
    description: Send a text message using an specific gsm provider
    in:
      fields:
        - name: gsmProviderId
          type: string
        - name: toNumber
          tags:
            validate: required
          type: string
        - name: body
          tags:
            validate: required
          type: string
    out:
      fields:
        - name: queueId
          type: string

entities:
  - name: gsmProvider
    fields:
      - name: apiKey
        type: string
      - name: mainSenderNumber
        type: string
        tags:
          validate: required
      - name: type
        type: enum
        tags:
          validate: required
        of:
          - k: url
          - k: terminal
          - k: mediana
      - name: invokeUrl
        type: string
      - name: invokeBody
        type: string
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: emailProvider
    description:
      Email servers and thirdparty services configuration to send emails across the app.
      Each configuration can be used for a different purpose, hence information is stored
      in database to give operation chance change the mail services without taking the
      server down.
    fields:
      - name: type
        description:
          Type of the service, or communication which actually is being used
          under the hood for providing the service, such as third party or printing
          right away for terminal or logs.
        tags:
          validate: required
        type: enum
        of:
          - k: sendgrid
          - k: mailgun
          - k: postmark
          - k: resend
          - k: smtp
          - k: terminal
      - name: title
        type: string
        description:
          Give the email provider configuration a name, which makes it easier later to query.
      - name: config
        type: complex
        description:
          JSON field which contains api keys, or other kind of configuration based
          on the type of the email provider.
        complex: JSON
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: emailSender
    description: >-
      All emails going from the system need to have a virtual sender (nick name,
      email address, etc)
    fields:
      - name: fromName
        type: string
        tags:
          validate: required
      - name: fromEmailAddress
        type: string
        tags:
          gorm: unique
          validate: required
      - name: replyTo
        type: string
        tags:
          validate: required
      - name: nickName
        tags:
          validate: required
        type: string
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime

  - name: webPushConfig
    description: Keeps a browser's web-push subscription for the user who registered it.
    fields:
      - name: subscription
        type: complex
        complex: JSON
        tags:
          validate: required
        description: The json content of the web push after getting it from browser
      - name: workspaceId
        type: string?
        description: The unique-id of the workspace which content belongs to.
      - name: userId
        type: string?
        description: The unique-id of the user which created/owns the record.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime
  - name: MessagingConfig
    cliShort: config
    features:
      actions: false
    description: >-
      Contains configuration which would be necessary for messaging and notification
    fields:
      - name: generalEmailProviderId
        type: string?
        description: >-
          The unique-id of the email provider service, which will be used to
          send the messages using it's service.
      - name: generalGsmProviderId
        type: string?
        description: The unique-id of the general service which would be used to send text messages (sms).
      - name: inviteToWorkspaceContentId
        type: string?
        description: The unique-id of the template used as default when a user is inviting a third-party into their own workspace.
      - name: emailOtpContentId
        type: string?
        description: The unique-id of the template used to fill the message for email one-time-password requests.
      - name: smsOtpContentId
        type: string?
        description: The unique-id of the template used for OTP text messages, including the one time password code.
      - name: createdAt
        type: complex
        complex: PlainTime
      - name: updatedAt
        type: complex
        complex: PlainTime
      - name: workspaceId
        type: string