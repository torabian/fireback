name: abac
description:
  Fireback ABAC module provides user authentication, basic support for most projects,
  including advanced role, permission module on top of fireback core module.
  Using this module is not essential to create fireback projects, but provides a great
  possibility to avoid building most user management flow.
  Some other helpers, such as timezone are added here.
entities:
  - name: timezoneGroup
    description: World timezone information
    queryScope: public
    cliName: tz
    fields:
      - name: title
        type: string
        description: Title which is shown to the user and allows them to select.
        translate: true
 
  - name: tableViewSizing
    cliShort: tvs
    description: >-
      Used to store meta data about user tables (in front-end, or apps for
      example) about the size of the columns
    fields:
      - name: tableName
        type: string
        validate: required
      - name: sizes
        type: string
  - name: appMenu
    cte: true
    description: "Manages the menus in the app, (for example tab views, sidebar items, etc.)"
    fields:
      - name: label
        type: string
        translate: true
        recommended: true
        description: Label that will be visible to user
      - name: href
        type: string
        recommended: true
        description: Location that will be navigated in case of click or selection on ui
      - name: icon
        type: string
        recommended: true
        description: Icon string address which matches the resources on the front-end apps.
      - name: activeMatcher
        type: string
        description: Custom window location url matchers, for inner screens.
      - name: capability
        type: one
        target: CapabilityEntity
        fields: []
        module: fireback
        description: The permission which is required for the menu to be visible.
  
  - name: notificationConfig
    distinctBy: workspace
    permRewrite:
      replace: root.modules
      with: root.manage
    security:
      writeOnRoot: true
      resolveStrategy: workspace
    description: >-
      Configuration for the notifications used in the app, such as default gsm
      number, email senders, and many more
    cliShort: config
    fields:
      - name: cascadeToSubWorkspaces
        type: bool
      - name: forcedCascadeEmailProvider
        type: bool
      - name: generalEmailProvider
        type: one
        target: EmailProviderEntity
      - name: generalGsmProvider
        type: one
        target: GsmProviderEntity
      - name: inviteToWorkspaceContent
        type: string
        gorm: text
      - name: inviteToWorkspaceContentExcerpt
        gorm: text
        type: string
      - name: inviteToWorkspaceContentDefault
        gorm: text
        sql: "-"
        type: string
      - name: inviteToWorkspaceContentDefaultExcerpt
        type: string
        gorm: text
        sql: "-"
      - name: inviteToWorkspaceTitle
        type: string
      - name: inviteToWorkspaceTitleDefault
        sql: "-"
        type: string
      - name: inviteToWorkspaceSender
        type: one
        target: EmailSenderEntity
      - name: accountCenterEmailSender
        type: one
        target: EmailSenderEntity
      - name: forgetPasswordContent
        gorm: text
        type: string
      - name: forgetPasswordContentExcerpt
        gorm: text
        type: string
      - name: forgetPasswordContentDefault
        gorm: text
        type: string
        sql: "-"
      - name: forgetPasswordContentDefaultExcerpt
        gorm: text
        sql: "-"
        type: string
      - name: forgetPasswordTitle
        gorm: text
        type: string
      - name: forgetPasswordTitleDefault
        gorm: text
        sql: "-"
        type: string
      - name: forgetPasswordSender
        type: one
        target: EmailSenderEntity
      - name: acceptLanguage
        type: string
      - name: confirmEmailSender
        type: one
        target: EmailSenderEntity
        fields: []
      - name: confirmEmailContent
        gorm: text
        type: string
      - name: confirmEmailContentExcerpt
        gorm: text
        type: string
      - name: confirmEmailContentDefault
        type: string
        gorm: text
        sql: "-"
      - name: confirmEmailContentDefaultExcerpt
        gorm: text
        sql: "-"
        type: string
      - name: confirmEmailTitle
        type: string
      - name: confirmEmailTitleDefault
        type: string
        sql: "-"
  - name: passportMethod
    cliShort: method
    permRewrite:
      replace: root.modules
      with: root.manage
    features:
      mock: false
      msync: false
    security:
      writeOnRoot: true
      readOnRoot: true
      resolveStrategy: workspace
    description: >-
      Login/Signup methods which are available in the app for different regions
      (Email, Phone Number, Google, etc)
    fields:
      - name: type
        type: enum
        validate: oneof=email phone google facebook,required
        of:
          - k: email
            description: Authenticate users using email
          - k: phone
            description: Authenticat users using phone number, can be sms, calls, or whatsapp.
          - k: google
            description: Users can be authenticated using their google account
          - k: facebook
            description: Users can be authenticated using their facebook account
      - name: region
        type: enum
        default: global
        description:
          The region which would be using this method of passports for authentication.
          In Fireback open-source, only 'global' is available.
        of:
          - k: global
        validate: required,oneof=global
      - name: clientKey
        type: string
        description: Client key for those methods such as 'google' which require oauth client key
      # - name: configuration
      #   type: json
      #   description:
      #     Configuration related to the passport method, for different types
  - name: workspaceInvite
    cliShort: invite
    description: >-
      Active invitations for non-users or already users to join an specific
      workspace, created by administration of the workspace
    fields:
      - name: publicKey
        type: string
        description:
          A long hash to get the user into the confirm or signup page without sending
          the email or phone number, for example if an administrator wants to copy the link.
      - name: coverLetter
        type: string
        description: The content that user will receive to understand the reason of the letter.
      - name: targetUserLocale
        type: string
        description:
          If the invited person has a different language, then you can define
          that so the interface for him will be automatically translated.
      - name: email
        type: string
        description: The email address of the person which is invited.
      - name: phonenumber
        type: string
        description: The phone number of the person which is invited.
      - name: workspace
        type: one
        target: WorkspaceEntity
        description: Workspace which user is being invite to.
      - name: firstName
        type: string
        validate: required
        description: First name of the person which is invited
      - name: lastName
        validate: required
        type: string
        description: Last name of the person which is invited.
      - name: forceEmailAddress
        type: bool?
        description: If forced, the email address cannot be changed by the user which has been invited.
      - name: forcePhoneNumber
        type: bool?
        description: If forced, user cannot change the phone number and needs to complete signup.
      - name: role
        type: one
        description: The role which invitee get if they accept the request.
        validate: required
        target: RoleEntity
        fields: []
  - name: pendingWorkspaceInvite
    fields:
      - name: value
        type: string
      - name: type
        type: string
      - name: coverLetter
        type: string
      - name: workspaceName
        type: string
      - name: role
        type: one
        target: RoleEntity
        fields: []
  - name: preference
    fields:
      - name: timezone
        type: string
  - name: token
    security:
      writeOnRoot: true
    permRewrite:
      replace: root.modules
      with: root.manage
    fields:
      - name: user
        type: one
        target: UserEntity
        fields: []
      - name: token
        type: string
      - name: validUntil
        type: complex
        complex: fireback.XDateTime
  - name: userWorkspace
    permRewrite:
      replace: root.modules
      with: root.manage
    cliShort: user
    description: >-
      Manage the workspaces that user belongs to (either its himselves or adding
      by invitation)
    security:
      resolveStrategy: user
    gormMap:
      workspaceId: "index:userworkspace_idx,unique"
      userId: "index:userworkspace_idx,unique"
    fields:
      - name: user
        type: one
        target: UserEntity
      - name: workspace
        type: one
        target: WorkspaceEntity
        fields: []
      - name: userPermissions
        gorm: "-"
        sql: "-"
        type: slice
        primitive: string
      - name: rolePermission
        gorm: "-"
        sql: "-"
        type: slice
        primitive: UserRoleWorkspaceDto
      - name: workspacePermissions
        gorm: "-"
        sql: "-"
        type: slice
        primitive: string
  - name: workspaceRole
    permRewrite:
      replace: root.modules
      with: root.manage
    cliShort: role
    description: >-
      Manage roles assigned to an specific workspace or created by the workspace
      itself
    fields:
      - name: userWorkspace
        type: one
        target: UserWorkspaceEntity
        idFieldGorm: "index:workspacerole_idx,unique"
      - name: role
        type: one
        target: RoleEntity
        idFieldGorm: "index:workspacerole_idx,unique"
        fields: []
  - name: user
    permRewrite:
      replace: root.modules
      with: root.manage
    security:
      writeOnRoot: true
    rpc:
      query:
        qs:
          - name: withImages
            type: bool?
    description: Manage the users who are in the current app (root only)
    events:
      - name: Googoli2
        description: Googlievent
        payload:
          fields:
            - name: entity
              type: string
    fields:
      - name: firstName
        type: string
        validate: required
      - name: lastName
        type: string
        validate: required
      - name: photo
        type: string
      - name: gender
        type: int?
      - name: title
        type: string
      - name: birthDate
        type: complex
        complex: fireback.XDate
      - name: avatar
        type: string
      - name: lastIpAddress
        type: string
        description: User last connecting ip address
      - name: primaryAddress
        type: object
        description:
          User primary address location. Can be useful for simple projects that a user is associated
          with a single address.
        fields:
          - name: addressLine1
            description: Street address, building number
            type: string
          - name: addressLine2
            description: Apartment, suite, floor (optional)
            type: string?
          - name: city
            description: City or locality
            type: string?
          - name: stateOrProvince
            description: State, region, or province
            type: string?
          - name: postalCode
            description: ZIP or postal code
            type: string?
          - name: countryCode
            description: ISO 3166-1 alpha-2 (e.g., \"US\", \"DE\")
            type: string?

  - name: userProfile
    fields:
      - name: firstName
        type: string
      - name: lastName
        type: string
  - name: workspace
    cte: true
    cliName: ws
    security:
      readOnRoot: true
      writeOnRoot: true
    permRewrite:
      replace: root.modules
      with: root.manage
    description: "Fireback general user role, workspaces services."
    fields:
      - name: description
        type: string
      - name: name
        validate: required
        type: string
      - name: type
        type: one
        target: WorkspaceTypeEntity
        validate: required
        fields: []
  - name: role
    description: "Manage roles within the workspaces, or root configuration"
    messages:
      roleNeedsOneCapability:
        en: Role atleast needs one capability to be selected.
    fields:
      - name: name
        type: string
        validate: "required,omitempty,min=1,max=200"
      - name: capabilities
        type: collection
        target: CapabilityEntity
        module: fireback
  - name: workspaceConfig
    cliName: config
    permRewrite:
      replace: root.modules
      with: root.manage
    distinctBy: workspace
    description:
      Contains configuration which would be necessary for application environment to be running.
      At the moment, a single record is allowed, and only for root workspace. But in theory
      it could be configured per each workspace independently.
      For sub projects do not touch this, rather create a custom config entity if workspaces
      in the product need extra config.
    security:
      writeOnRoot: true
      readOnRoot: true
      resolveStrategy: workspace
    fields:
      - name: enableRecaptcha2
        type: bool?
        description: Enables the recaptcha2 for authentication flow.
      - name: enableOtp
        recommended: true
        type: bool?
        description: Enables the otp option. It's not forcing it, so user can choose if they want otp or password.
      - name: requireOtpOnSignup
        type: bool?
        recommended: true
        description:
          Forces the user to have otp verification before can create an account.
          They can define their password still.
      - name: requireOtpOnSignin
        type: bool?
        recommended: true
        description:
          Forces the user to use otp when signing in. Even if they have password set,
          they won't use it and only will be able to signin using that otp.
        default: false
      - name: recaptcha2ServerKey
        type: string
        description:
          Secret which would be used to decrypt if the recaptcha is correct.
          Should not be available publicly.
      - name: recaptcha2ClientKey
        type: string
        description:
          Secret which would be used for recaptcha2 on the client side. Can be publicly visible,
          and upon authenticating users it would be sent to front-end.
      - name: enableTotp
        type: bool?
        recommended: true
        description: Enables user to make 2FA using apps such as google authenticator or microsoft authenticator.
      - name: forceTotp
        type: bool?
        recommended: true
        description:
          Forces the user to setup a 2FA in order to access their account.
          Users which did not setup this won't be affected.
      - name: forcePasswordOnPhone
        type: bool?
        description:
          Forces users who want to create account using phone number to
          also set a password on their account
      - name: forcePersonNameOnPhone
        type: bool?
        description: Forces the creation of account using phone number to ask for user first name and last name
      - name: generalEmailProvider
        type: one
        target: EmailProviderEntity
        description:
          Email provider service, which will be used to send the messages using it's service. It doesn't
          affect the message content, rather, you can choose via which third-party service, or even your own
          smtp service to send emails.

      - name: generalGsmProvider
        type: one
        target: GsmProviderEntity
        description: General service which would be used to send text messages (sms) using it's services or API.

      - name: inviteToWorkspaceContent
        type: one
        target: RegionalContentEntity
        description: This template would be used, as default when a user is inviting a third-party into their own workspace.

      - name: emailOtpContent
        type: one
        target: RegionalContentEntity
        description: Upon one time password request for email, the content will be read to fill the message which will go to user.

      - name: smsOtpContent
        type: one
        target: RegionalContentEntity
        description: Upon OTP text messages, this template will be used to create such text message, including the one time password code.

  - name: gsmProvider
    permRewrite:
      replace: root.modules
      with: root.manage
    fields:
      - name: apiKey
        type: string
      - name: mainSenderNumber
        type: string
        validate: required
      - name: type
        validate: required
        type: enum
        of:
          - k: url
          - k: terminal
          - k: mediana
      - name: invokeUrl
        type: string
      - name: invokeBody
        type: string
  - name: workspaceType
    permRewrite:
      replace: root.modules
      with: root.manage
    cliName: type
    features:
      mock: false
      msync: false
    security:
      writeOnRoot: true
      readOnRoot: true
    messages:
      roleIsNecessary:
        en: Role needs to be defined and exist.
      roleIsNotAccessible:
        en: Role is not accessible unfortunately. Make sure you the role chose exists.
      onlyRootRoleIsAccepted:
        en: You can only select a role which is created or belong to 'root' workspace.
      roleNeedsToHaveCapabilities:
        en: Role needs to have at least one capability before could be assigned.
      cannotCreateWorkspaceType:
        en: You cannot create workspace type due to some validation errors.
      cannotModifyWorkspaceType:
        en: You cannot modify workspace type due to some validation errors.

    description:
      Defines a type for workspace, and the role which it can have as a whole.
      In systems with multiple types of services, e.g. student, teachers, schools
      this is useful to set those default types and limit the access of the users.
    fields:
      - name: title
        translate: true
        type: string
        validate: "required,omitempty,min=1,max=250"
      - name: description
        translate: true
        type: string
      - name: slug
        type: string
        validate: "required,omitempty,min=2,max=50"
      - name: role
        type: one
        target: RoleEntity
        validate: required
        description:
          The role which will be used to define the functionality of this workspace,
          Role needs to be created before hand, and only roles which belong to root workspace
          are possible to be selected
        fields: []
  - name: emailProvider
    permRewrite:
      replace: root.modules
      with: root.manage
    description:
      Email servers and thirdparty services configuration to send emails across the app.
      Each configuration can be used for a different purpose, hence information is stored
      in database to give operation chance change the mail services without taking the 
      server down.
    security:
      writeOnRoot: true
      readOnRoot: true
    fields:
      - name: type
        description: 
          Type of the service, or communication which actually is being used
          under the hood for providing the service, such as third party or printing
          right away for terminal or logs.
        validate: required
        type: enum
        of:
          - k: sendgrid
          - k: mailgun
          - k: postmark
          - k: resend
          - k: smtp
          - k: terminal
      - name: title
        type: string
        description: 
          Give the email provider configuration a name, which makes it easier later to query.
      - name: config
        type: complex
        description: 
          JSON field which contains api keys, or other kind of configuration based
          on the type of the email provider.
        complex: fireback.JSON
  - name: emailSender
    permRewrite:
      replace: root.modules
      with: root.manage
    security:
      writeOnRoot: true
    description: >-
      All emails going from the system need to have a virtual sender (nick name,
      email address, etc)
    fields:
      - name: fromName
        type: string
        validate: required
      - name: fromEmailAddress
        type: string
        gorm: unique
        validate: required
      - name: replyTo
        type: string
        validate: required
      - name: nickName
        validate: required
        type: string
  - name: phoneConfirmation
    permRewrite:
      replace: root.modules
      with: root.manage
    fields:
      - name: user
        target: UserEntity
        type: one
        fields: []
      - name: status
        type: string
      - name: phoneNumber
        type: string
      - name: key
        type: string
      - name: expiresAt
        type: string
  - name: publicJoinKey
    description: Joining to different workspaces using a public link directly
    fields:
      - name: role
        type: one
        target: RoleEntity
      - name: workspace
        type: one
        target: WorkspaceEntity
        fields: []
  - name: emailConfirmation
    fields:
      - name: user
        target: UserEntity
        type: one
        fields: []
      - name: status
        type: string
      - name: email
        type: string
      - name: key
        type: string
      - name: expiresAt
        type: string
  - name: passport
    description:
      Represent a mean to login in into the system, each user could have multiple passport (email, phone)
      and authenticate into the system.
    permRewrite:
      replace: root.modules
      with: root.manage
    security:
      writeOnRoot: true
    fields:
      - name: thirdPartyVerifier
        type: string
        default: false
        description:
          When user creates account via oauth services such as google,
          it's essential to set the provider and do not allow passwordless logins
          if it's not via that specific provider.
      - name: type
        type: string
        validate: required
      - name: user
        type: one
        target: UserEntity
        fields: []
      - name: value
        type: string
        validate: required
        gorm: unique
      - name: totpSecret
        type: string
        description:
          Store the secret of 2FA using time based dual factor authentication here for this specific
          passport. If set, during authorization will be asked.
      - name: totpConfirmed
        type: bool?
        description:
          Regardless of the secret, user needs to confirm his secret. There is an extra action
          to confirm user totp, could be used after signup or prior to login.
      - name: password
        type: string
        json: "-"
        yaml: "-"
      - name: confirmed
        type: bool?
      - name: accessToken
        type: string
  - name: regionalContent
    cliShort: rc
    permRewrite:
      replace: root.modules
      with: root.manage
    security:
      writeOnRoot: true
    description: >-
      Email templates, sms templates or other textual content which can be
      accessed.
    fields:
      - name: content
        type: string
        validate: required
      - name: region
        validate: required
        type: string
      - name: title
        type: string
      - name: languageId
        validate: required
        gorm: "index:regional_content_index,unique"
        type: string
      - name: keyGroup
        validate: required
        type: enum
        of:
          - k: SMS_OTP
            description: Used when an email would be sent with one time password
          - k: EMAIL_OTP
            description: Used when an sms would be sent with one time password
        gorm: "index:regional_content_index,unique"
  - name: publicAuthentication
    cliShort: pa
    security:
      writeOnRoot: true
    permRewrite:
      replace: root.modules
      with: root.manage
    description:
      Keeps information about user onboarding, otp state, and other things
      which are necessary for onboarding new users in multiple endpoints
    fields:
      - name: user
        target: UserEntity
        type: one
      - name: totpSecret
        type: string
        description:
          If the application requires totp dual factor upon account creation,
          we create a secret here and pass the link
      - name: totpLink
        type: string
        description: The url which will be converted into QR code on client side to scan
      - name: passport
        target: PassportEntity
        type: one
        fields: []
      - name: sessionSecret
        type: string
        description:
          This is a long hash generated and will be used to authenticate user after
          he confirmed the otp to finish the signup process and add more information
          before creating an account
      - name: passportValue
        type: string
      - name: isInCreationProcess
        type: bool?
      - name: status
        type: string
      - name: blockedUntil
        type: int64
      - name: otp
        type: string
      - name: recoveryAbsoluteUrl
        type: string
        sql: "-"
messages:
  recaptcha2Error:
    en: Recaptcha is not correct. Try again to solve the recaptcha.
  recaptcha2Needed:
    en: You need to provide recaptcha2 for this api.
  dataTypeDoesNotExistsInFireback:
    en: This data type does not exist in fireback. %name %location
  inviteToWorkspaceMailSenderMissing:
    en: >-
      We cannot send the invitation via email address, because sender email is
      not available, or not configurated.
    fa: >-
      امکان ارسال دعوت نامه از طریق ایمیل وجود ندارد، چون مدیریت تنظیمات لازم
      برای ایمیل را انجام نداده یا آن را برای شما محدود کرده است.
  userWhichHasThisTokenDoesNotExist:
    en: User which has this token does not exists
    fa: >-
      کاربری که با این دسترسی وارد شده بود وجود ندارد. لطفا دوباره به سیستم وارد
      شوید
  provideTokenInAuthorization:
    en: >-
      Request requires authroization, please make sure you are logged in, and
      have enough access level
    fa: شما باید توکن دسترسی را در بخش هدر و قسمت authorization وارد کنید

  tokenNotFound:
    en: Token not found or no longer valid.

  userNotFoundOrDeleted:
    en: >-
      User not found, your account might be deleted, or access level has been
      reduced.
    fa: >-
      کاربر پیدا نشد ممکن است اکانت حذف شده باشد یا سطح دسترسی آن کاهش پیدا کرده
      باشد
  selectWorkspaceId:
    en: You need to select a correct workspace-id in header section
    fa: شما باید تیم یا ورک اسپیس را در بخش هدر با فیلد workspace-id تعیین کنید
  emailConfigurationMissing:
    en: Email configuration is not available
  gsmConfigurationIsNotAvailable:
    en: GSM Services configuration is not available
  emailConfigurationIsNotAvailable:
    en: Email configuration is not available
  passportUserNotAvailable:
    en: User with this passport is not available at this moment
  userDoesNotExist:
    en: User is not available.
  alreadyConfirmed:
    en: Already confirmed
  emailNotFound:
    en: Email is not found
  emailIsNotValid:
    en: The email address is not valid.
  phoneNumberIsNotValid:
    en: The phone number is not valid.
  invitationExpired:
    en: Invitation has been expired.
  passwordRequired:
    en: Password is required
  passportNotAvailable:
    en: This passport is not available. Please check credentials and try again
  resetNotFound:
    en: Reset not found
  passportNotFound:
    en: This passport is not available. Please check credentials and try again
  passwordDidNotUpdated:
    en: Password did not get updated for some unknown reason.
  otaRequestBlockedUntil:
    en: Request is blocked until.
  emailIsNotConfigured:
    en: Email server is not configured
  otpCodeInvalid:
    en: Otp code is invalid
  invalidContent:
    en: Body content is not correct. You need a valid json.
  bodyIsMissing:
    en: Body content is not correct. You need a valid json.
  notEnoughPermission:
    en: You do not have enough permission for this section
  invalidExchangeKey:
    en: Invalid exchange key
  smsNotSent:
