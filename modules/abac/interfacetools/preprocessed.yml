complexes:
- name: PlainTime
  namespace: abaccomplexes
  location: github.com/torabian/fireback/modules/abac/abaccomplexes
  compiler: go
- name: TString
  namespace: complexes
  location: github.com/torabian/fireback/modules/fireback/complexes
  compiler: go
actions:
- name: CteAppMenus
  cliName: cte-app-menus
  url: /cte-app-menus
  method: get
  qs:
  - name: filter
    type: string
  - name: sort
    type: string
  - name: startIndex
    type: int
  - name: itemsPerPage
    type: int
  - name: cursor
    type: string
  description: 'Returns "appMenu" rows assembled into a tree (each item''s children
    nested under it via a recursive query) instead of Browse''s flat list - restores
    the old Module3-generated /cte-app-menus route. See AppMenuActions.CteQuery /
    AppMenuTreeNode. Note: Emi has no self-referencing dto, so the declared response
    type here is the flat AppMenuOptionalDto - the actual JSON payload additionally
    nests a "children" array of the same shape under each item.'
  out:
    envelope: GResponse
    dto: AppMenuOptionalDto
- name: appMenuCreate
  cliName: create
  cliShort: appMenu-c
  url: /appMenu
  method: post
  description: Creates a new "appMenu" row.
  in:
    dto: AppMenuDto
  out:
    envelope: GResponse
    dto: AppMenuDto
- name: appMenuUpdate
  cliName: update
  cliShort: appMenu-u
  url: /appMenu/:uniqueId
  method: patch
  description: Applies a partial update to a "appMenu" row by uniqueId.
  in:
    dto: AppMenuOptionalDto
  out:
    envelope: GResponse
    dto: AppMenuDto
- name: appMenuGet
  cliName: get
  cliShort: appMenu-g
  url: /appMenu/:uniqueId
  method: get
  description: Looks up a single "appMenu" row by uniqueId.
  out:
    envelope: GResponse
    dto: AppMenuDto
- name: appMenuBrowse
  cliName: browse
  cliShort: appMenu-b
  url: /appMenu/browse
  method: get
  qs:
  - name: filter
    type: string
  - name: sort
    type: string
  - name: startIndex
    type: int
  - name: itemsPerPage
    type: int
  - name: cursor
    type: string
  description: Returns "appMenu" rows matching a filter, sorted/paged (see emigorm.ApplyQueryFilter/ApplyQueryScope).
  out:
    envelope: GResponse
    dto: AppMenuOptionalDto
- name: appMenuAwareDeletePreview
  cliName: delete-preview
  cliShort: appMenu-dp
  url: /appMenu/delete-preview
  method: get
  qs:
  - name: uniqueIds
    type: slice
    primitive: string
  description: Reports what deleting the given "appMenu" uniqueIds would affect, without
    deleting anything.
  out:
    envelope: GResponse
    fields:
    - name: message
      type: string
    - name: affected
      type: array
      fields:
      - name: relation
        type: string
      - name: count
        type: int64
- name: appMenuAwareDelete
  cliName: delete
  cliShort: appMenu-d
  url: /appMenu/delete
  method: post
  description: Deletes the given "appMenu" uniqueIds, along with everything appMenuAwareDeletePreview
    reports.
  in:
    fields:
    - name: uniqueIds
      type: slice
      primitive: string
