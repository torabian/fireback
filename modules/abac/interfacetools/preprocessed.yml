targets:
- compiler: go
  flags:
    pkg: interfacetoolsdefs
  output: ./defs
  tags:
  - split-cli
- compiler: js
  flags:
    js-sdk-location: '@fireback/js-remote-ctx'
  output: ../../../ui/packages/ui-core/sdk/interfacetools
  tags:
  - typescript
  - react
  - no-package
  - no-sdk
  clean: true
- compiler: preprocessor
  output: ./
description: Small, front-end-facing utility entities with no cross-entity dependencies
  of their own - app menu/sidebar definitions (including the recursive /cte-app-menus
  tree query), per-table column-width persistence, and the timezone picker list. Split
  out of abac since none of them need Role/Workspace/User types directly (workspaceId/userId
  are plain nullable strings on all three, same as elsewhere in this migration).
name: interfacetools
dtos:
- description: Every field of the "appMenu" entity, but optional - used both as Update's
    partial input and as Browse's response item shape.
  name: appMenuOptional
  fields:
  - name: uniqueId
    type: string?
  - name: label
    description: 'Label that will be visible to user, as a locale -> text map (e.g.
      {"en": "Home", "fa": "خانه"}) - see complexes.TString.'
    type: complex
    complex: TString
  - name: href
    description: Location that will be navigated in case of click or selection on
      ui
    type: string?
  - name: icon
    description: Icon string address which matches the resources on the front-end
      apps.
    type: string?
  - name: activeMatcher
    description: Custom window location url matchers, for inner screens.
    type: string?
  - name: capabilityId
    description: The unique-id of the capability which is required for the menu to
      be visible.
    type: string?
  - name: parentId
    description: The unique-id of the parent menu item, for nested/tree menus.
    type: string?
  - name: workspaceId
    type: string?
  - name: userId
    type: string?
  - name: createdAt
    type: complex
    complex: PlainTime
  - name: updatedAt
    type: complex
    complex: PlainTime
- description: Every field of the "tableViewSizing" entity, but optional - used both
    as Update's partial input and as Browse's response item shape.
  name: tableViewSizingOptional
  fields:
  - name: uniqueId
    type: string?
  - name: tableName
    type: string?
    tags:
      validate: required
  - name: sizes
    type: string?
  - name: workspaceId
    description: The unique-id of the workspace which content belongs to.
    type: string?
  - name: userId
    description: The unique-id of the user which created/owns the record.
    type: string?
  - name: createdAt
    description: The time the record was created. Populated automatically by gorm.
    type: complex
    complex: PlainTime
  - name: updatedAt
    description: The time the record was last updated. Populated automatically by
      gorm.
    type: complex
    complex: PlainTime
- description: Every field of the "timezoneGroup" entity, but optional - used both
    as Update's partial input and as Browse's response item shape.
  name: timezoneGroupOptional
  fields:
  - name: uniqueId
    type: string?
  - name: title
    description: Title which is shown to the user and allows them to select.
    type: string?
  - name: workspaceId
    description: The unique-id of the workspace which content belongs to.
    type: string?
  - name: userId
    description: The unique-id of the user which created/owns the record.
    type: string?
  - name: createdAt
    type: complex
    complex: PlainTime
  - name: updatedAt
    type: complex
    complex: PlainTime
- description: Plain dto mirroring the "appMenu" entity's own fields.
  name: appMenu
