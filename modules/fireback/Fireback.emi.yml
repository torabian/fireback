targets:
  - compiler: go
    output: ./
    flags:
      pkg: fireback

dtos:
  - name: deleteRequest
    fields:
      - name: query
        type: string
        description: The query selector which would be used to delete the content.
  - name: deleteResponse
    fields:
      - name: data
        type: object
        fields:
          - name: item
            type: object
            fields:
            - name: executed
              type: bool
              description: 
                If the deletion executed immediately.
            - name: rowsAffected
              type: int64
              description: The query selector which would be used to delete the content.
  - name: okayResponse
    fields:
      - name: status
        type: int
  - name: capabilityInfo
    description: Capability and permission level which is suitable for front-end application to interact...
    fields:
      - name: uniqueId
        type: string
      - name: name
        type: string
      - name: children
        type: collection
        target: self@
  - name: reactiveSearchResult
    fields:
      - type: string
        name: uniqueId
      - type: string
        name: phrase
      - type: string
        name: icon
      - type: string
        name: description
      - type: string
        name: group
      - type: string
        name: uiLocation
      - type: string
        name: actionFn

actions:
  - name: CapabilitiesTree
    cliName: treex
    url: /capabilitiesTree
    method: get
    description: dLists all of the capabilities in database as a array of string as root access
    out:
      envelope: GResponse
      fields:
        - name: capabilities
          type: collection
          target: CapabilityInfoDto
        - name: nested
          type: collection
          target: CapabilityInfoDto

  # - name: GetCapabilities
  #   description: Get the capabilities inside a system
  #   url: /capabilities2
  #   method: get
  #   out:
  #     envelope: GResponse
  #     fields:
  #       - name: capabilities
  #         type: collection
  #         target: CapabilityInfoDto
  #       - name: nested
  #         type: collection
  #         target: CapabilityInfoDto

      
  - name: ReactiveSearch
    description:
      Reactive search is a general purpose search mechanism for different modules,
      and could be used in mobile apps or front-end to quickly search for a entity.
    url: /reactive-search
    method: reactive
    security:
      resolveStrategy: workspace

  - name: EventBusSubscription
    description: Connects a client to all events related to their user profile, or workspace they are in
    method: reactive
    url: /ws
    security:
      resolveStrategy: workspace