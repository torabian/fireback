targets:
- compiler: go
  flags:
    pkg: fireback
  output: ./
  tags:
  - split-cli
- compiler: js
  flags:
    js-sdk-location: '@fireback/js-remote-ctx'
  output: ../../ui/packages/ui-core/sdk/fireback
  tags:
  - typescript
  - react
  - no-sdk
  - no-package
  clean: true
- compiler: preprocessor
  output: ./
description: Fireback core module. ReactiveSearch and EventBusSubscription have moved
  to their own opt-in modules (see modules/reactivesearch/ReactiveSearch.emi.yml and
  modules/eventbus/EventBus.emi.yml) - a project only gets them by explicitly calling
  reactivesearch.ModuleSetup(...)/eventbus.ModuleSetup(...) from its own main.go,
  instead of Fireback module always wiring them in.
complexes:
- name: JSON
  namespace: complexes
  location: github.com/torabian/fireback/modules/fireback/complexes
  compiler: go
config:
- name: cookieAuthOnly
  type: bool
  description: When true, the sessions (after authentication) would not return the
    token back in the response, and token will be only accessible via secure cookie.
- name: production
  type: bool
  description: If true, set's the environment behavior to production, and some functionality
    will be limited
- name: showDoctor
  type: bool
  description: If true, prints the doctor report (config, environment urls, database
    info) when the http server starts via 'start'. Defaults to false - run 'fireback
    doctor' directly when you need it instead.
- name: tablePrefix
  type: string
  description: Prefix all gorm tables with some string
- name: vapidPublicKey
  type: string
  description: VAPID Web push notification public key
- name: vapidPrivateKey
  type: string
  description: VAPID Web push notification private key
- name: tokenGenerationStrategy
  type: string
  description: Fireback supports generating tokens based on random short string, or
    jwt.
  default: random
- name: jwtSecretKey
  type: string
  description: If tokenGenerationStrategy is set to jwt, then these secret will be
    used.
- name: withTaskServer
  type: bool
  description: Runs the tasks server asyncq library when the http server starts. Useful
    for all in one applications to run everything in single instance
  default: "false"
- name: name
  description: Environment name, such as dev, prod, test, test-eu, etc...
- name: certFile
  description: SSL Certification location to server on http listener
- name: keyFile
  description: SSL Certification key file
- name: dbLogLevel
  description: Database log level for SQL queries, used by GORM orm. Default it's
    silent. 'warn', 'error', 'info' are other options.
  default: silent
- name: useSSL
  type: bool
  description: If set to true, all http traffic will be redirected into https. Needs
    certFile and keyFile to be defined otherwise no effect
- name: sslProvider
  description: 'How the certificate used by useSSL is obtained: ''manual'' (certFile/keyFile
    point at a certificate you already have), ''self-signed'' (a locally generated
    certificate, persisted to certFile/keyFile so it survives restarts - not trusted
    by browsers), or ''letsencrypt'' (an ACME certificate for acmeDomains, requested
    and renewed automatically via golang.org/x/crypto/acme/autocert while the server
    is running). Empty falls back to the legacy behavior: manual if certFile/keyFile
    are set, otherwise an ephemeral self-signed certificate regenerated on every start.
    Set by ''fireback ssl enable''.'
- name: acmeDomains
  description: Comma separated list of domains to request a Let's Encrypt certificate
    for, when sslProvider is 'letsencrypt'. Each domain must resolve to this server
    and have port 80 reachable for the ACME HTTP-01 challenge.
- name: acmeEmail
  description: Contact email registered with Let's Encrypt for expiry notices, when
    sslProvider is 'letsencrypt'. Optional but recommended.
- name: acmeCacheDir
  description: Directory where the ACME account key and issued certificates are cached,
    when sslProvider is 'letsencrypt'. Must persist across restarts so certificates
    aren't re-requested (and to stay under Let's Encrypt's rate limits).
  default: ./.fireback-acme-cache
- name: dbDsn
  description: 'The single source of truth for the database connection: a full DSN
    (postgres keyword/value string, mysql go-sql-driver DSN, or - for sqlite - the
    database file path itself, or in-memory). See modules/fireback/dbdsn for reading/writing
    individual pieces (host/port/username/password/database/ssl) of this string; there
    is no separate set of DB_HOST/DB_PORT/etc fields to keep in sync with it.'
- name: ginMode
  description: Gin framework mode, which could be 'test', 'debug', 'release'
- name: storage
  description: This is the storage url which files will be uploaded to
- name: dbVendor
  description: Database vendor name, such as sqlite, mysql, or any other supported
    database.
  default: sqlite
- name: stdOut
  description: Writes the logs instead of std out into these log files.
- name: workerAddress
  description: This is the url (host and port) of a queue service. If not set, we
    use the internal queue system
  default: 127.0.0.1:6379
- name: workerConcurrency
  type: int
  description: How many tasks worker can take concurrently
  default: "10"
- name: stdErr
  description: Writes the errors instead of std err into these log files.
- name: cliToken
  description: Authorization token for cli apps, to access resoruces similar on http
    api
- name: cliRegion
  description: Region, for example us or pl
  default: us
- name: cliLanguage
  description: Language of the cli operations, for example en or pl
  default: en
- name: cliWorkspace
  description: Selected workspace in the cli context.
- name: port
  type: int64
  description: The port which application would be lifted
  default: "4500"
- name: host
  description: Application host which http server will be lifted
  default: localhost
- name: macIdentifier
  description: Used name for installing app as system service on macos installers
  default: fireback
- name: debianIdentifier
  description: Used name for installing app as system service on ubuntu installers
  default: fireback
- name: windowsIdentifier
  description: Used name for installing app as system service on windows installers
  default: fireback
