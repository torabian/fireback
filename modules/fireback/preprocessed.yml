targets:
- compiler: go
  flags:
    pkg: fireback
  output: ./
- compiler: js
  flags:
    js-sdk-location: ../sdk
  output: ../project-generator/react-new/src/modules/fireback/sdk/fireback
  tags:
  - typescript
  - react
  - no-sdk
- compiler: preprocessor
  output: ./
dtos:
- name: reactiveSearchResult
  fields:
  - name: uniqueId
    type: string
  - name: phrase
    type: string
  - name: icon
    type: string
  - name: description
    type: string
  - name: group
    type: string
  - name: uiLocation
    type: string
  - name: actionFn
    type: string
complexes:
- name: JSON
  namespace: complexes
  location: github.com/torabian/fireback/modules/fireback/complexes
  compiler: go
actions:
- name: ReactiveSearch
  url: /reactive-search
  method: reactive
  description: Reactive search is a general purpose search mechanism for different
    modules, and could be used in mobile apps or front-end to quickly search for a
    entity.
- name: EventBusSubscription
  url: /ws
  method: reactive
  description: Connects a client to all events related to their user profile, or workspace
    they are in
config:
- name: cookieAuthOnly
  type: bool
  description: When true, the sessions (after authentication) would not return the
    token back in the response, and token will be only accessible via secure cookie.
- name: production
  type: bool
  description: If true, set's the environment behavior to production, and some functionality
    will be limited
- name: redisEventsUrl
  type: string
  description: The address of the redis, which will be used to distribute the events.
    If provided empty, internal golang event library will be used, and events won't
    be distributed across different instances
  default: 127.0.0.1:6379
- name: tablePrefix
  type: string
  description: Prefix all gorm tables with some string
- name: vapidPublicKey
  type: string
  description: VAPID Web push notification public key
- name: vapidPrivateKey
  type: string
  description: VAPID Web push notification private key
- name: tokenGenerationStrategy
  type: string
  description: Fireback supports generating tokens based on random short string, or
    jwt.
  default: random
- name: jwtSecretKey
  type: string
  description: If tokenGenerationStrategy is set to jwt, then these secret will be
    used.
- name: withTaskServer
  type: bool
  description: Runs the tasks server asyncq library when the http server starts. Useful
    for all in one applications to run everything in single instance
  default: "false"
- name: name
  description: Environment name, such as dev, prod, test, test-eu, etc...
- name: dbName
  description: Database name for vendors which provide database names, such as mysql.
    Filename on disk for sqlite.
  default: ':memory:'
- name: certFile
  description: SSL Certification location to server on http listener
- name: keyFile
  description: SSL Certification key file
- name: dbLogLevel
  description: Database log level for SQL queries, used by GORM orm. Default it's
    silent. 'warn', 'error', 'info' are other options.
  default: silent
- name: useSSL
  type: bool
  description: If set to true, all http traffic will be redirected into https. Needs
    certFile and keyFile to be defined otherwise no effect
- name: dbPort
  type: int64
  description: Database port for those which are having a port, 3306 on mysql for
    example
- name: driveEnabled
  type: bool
  description: Drive is a mechanism to have file upload and download, inlining integrated
    into the fireback
  default: "true"
- name: dbDsn
  description: Connection dsn to database. Some databases allow connection using a
    string with all credentials and configs. This has hight priority, if set other
    details will be ignored.
- name: dbHost
  description: Database host, such as localhost, or 127.0.0.1
- name: dbUsername
  description: Database username for connection, such as root.
- name: dbPassword
  description: Database password for connection. Can be empty if there is no password
- name: ginMode
  description: Gin framework mode, which could be 'test', 'debug', 'release'
- name: storage
  description: This is the storage url which files will be uploaded to
- name: dbVendor
  description: Database vendor name, such as sqlite, mysql, or any other supported
    database.
  default: sqlite
- name: stdOut
  description: Writes the logs instead of std out into these log files.
- name: workerAddress
  description: This is the url (host and port) of a queue service. If not set, we
    use the internal queue system
  default: 127.0.0.1:6379
- name: workerConcurrency
  type: int
  description: How many tasks worker can take concurrently
  default: "10"
- name: stdErr
  description: Writes the errors instead of std err into these log files.
- name: tusPort
  description: Resumable file upload server port.
- name: cliToken
  description: Authorization token for cli apps, to access resoruces similar on http
    api
- name: cliRegion
  description: Region, for example us or pl
  default: us
- name: cliLanguage
  description: Language of the cli operations, for example en or pl
  default: en
- name: cliWorkspace
  description: Selected workspace in the cli context.
- name: port
  type: int64
  description: The port which application would be lifted
  default: "4500"
- name: host
  description: Application host which http server will be lifted
  default: localhost
- name: macIdentifier
  description: Used name for installing app as system service on macos installers
  default: fireback
- name: debianIdentifier
  description: Used name for installing app as system service on ubuntu installers
  default: fireback
- name: windowsIdentifier
  description: Used name for installing app as system service on windows installers
  default: fireback
