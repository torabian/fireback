targets:
- compiler: go
  flags:
    pkg: fireback
  output: ./
- compiler: js
  flags:
    js-sdk-location: ../sdk
  output: ../project-generator/react-new/src/modules/fireback/sdk/fireback
  tags:
  - typescript
  - react
  - no-sdk
- compiler: preprocessor
  output: ./
dtos:
- name: deleteRequest
  fields:
  - name: query
    description: The query selector which would be used to delete the content.
    type: string
- name: deleteResponse
  fields:
  - name: data
    type: object
    fields:
    - name: item
      type: object
      fields:
      - name: executed
        description: If the deletion executed immediately.
        type: bool
      - name: rowsAffected
        description: The query selector which would be used to delete the content.
        type: int64
- name: okayResponse
  fields:
  - name: status
    type: int
- description: Capability and permission level which is suitable for front-end application
    to interact...
  name: capabilityInfo
  fields:
  - name: uniqueId
    type: string
  - name: name
    type: string
  - name: children
    type: collection
    target: self@
- name: reactiveSearchResult
  fields:
  - name: uniqueId
    type: string
  - name: phrase
    type: string
  - name: icon
    type: string
  - name: description
    type: string
  - name: group
    type: string
  - name: uiLocation
    type: string
  - name: actionFn
    type: string
- description: Every field of the "capability" entity, but optional - used both as
    Update's partial input and as Browse's response item shape.
  name: capabilityOptional
  fields:
  - name: uniqueId
    type: string?
  - name: name
    type: string?
  - name: description
    type: string?
- description: Every field of the "webPushConfig" entity, but optional - used both
    as Update's partial input and as Browse's response item shape.
  name: webPushConfigOptional
  fields:
  - name: uniqueId
    type: string?
  - name: subscription
    description: The json content of the web push after getting it from browser
    type: complex
    complex: JSON
- description: Plain dto mirroring the "capability" entity's own fields.
  name: capability
  fields:
  - name: uniqueId
    type: string?
  - name: name
    type: string
  - name: description
    type: string
- description: Plain dto mirroring the "webPushConfig" entity's own fields.
  name: webPushConfig
  fields:
  - name: uniqueId
    type: string?
  - name: subscription
    description: The json content of the web push after getting it from browser
    type: complex
    complex: JSON
entities:
- name: capability
  fields:
  - name: name
    type: string
  - name: description
    type: string
  cliShort: cap
  description: Manage the capabilities inside the application, both builtin to core
    and custom defined ones
- name: webPushConfig
  features:
    actions: false
  fields:
  - name: subscription
    description: The json content of the web push after getting it from browser
    type: complex
    complex: JSON
    tags:
      validate: required
  description: Keep the web push notification configuration for each user
complexes:
- name: JSON
  namespace: complexes
  location: github.com/torabian/fireback/modules/fireback/complexes
  compiler: go
actions:
- name: CapabilitiesTree
  cliName: treex
  url: /capabilitiesTree
  method: get
  description: dLists all of the capabilities in database as a array of string as
    root access
  out:
    envelope: GResponse
    fields:
    - name: capabilities
      type: collection
      target: CapabilityInfoDto
    - name: nested
      type: collection
      target: CapabilityInfoDto
- name: ReactiveSearch
  url: /reactive-search
  method: reactive
  description: Reactive search is a general purpose search mechanism for different
    modules, and could be used in mobile apps or front-end to quickly search for a
    entity.
- name: EventBusSubscription
  url: /ws
  method: reactive
  description: Connects a client to all events related to their user profile, or workspace
    they are in
- name: capabilityCreate
  cliShort: capability-c
  url: /capability
  method: post
  description: Creates a new "capability" row.
  in:
    dto: CapabilityDto
  out:
    envelope: GResponse
    dto: CapabilityDto
- name: capabilityUpdate
  cliShort: capability-u
  url: /capability/:uniqueId
  method: patch
  description: Applies a partial update to a "capability" row by uniqueId.
  in:
    dto: CapabilityOptionalDto
  out:
    envelope: GResponse
    dto: CapabilityDto
- name: capabilityGet
  cliShort: capability-g
  url: /capability/:uniqueId
  method: get
  description: Looks up a single "capability" row by uniqueId.
  out:
    envelope: GResponse
    dto: CapabilityDto
- name: capabilityBrowse
  cliShort: capability-b
  url: /capability/browse
  method: get
  qs:
  - name: filter
    type: string
  - name: sort
    type: string
  - name: startIndex
    type: int
  - name: itemsPerPage
    type: int
  - name: cursor
    type: string
  description: Returns "capability" rows matching a filter, sorted/paged (see emigorm.ApplyQueryFilter/ApplyQueryScope).
  out:
    envelope: GResponse
    dto: CapabilityOptionalDto
- name: capabilityAwareDeletePreview
  cliShort: capability-dp
  url: /capability/delete-preview
  method: get
  qs:
  - name: uniqueIds
    type: slice
    primitive: string
  description: Reports what deleting the given "capability" uniqueIds would affect,
    without deleting anything.
  out:
    envelope: GResponse
    fields:
    - name: message
      type: string
    - name: affected
      type: array
      fields:
      - name: relation
        type: string
      - name: count
        type: int64
- name: capabilityAwareDelete
  cliShort: capability-d
  url: /capability/delete
  method: post
  description: Deletes the given "capability" uniqueIds, along with everything capabilityAwareDeletePreview
    reports.
  in:
    fields:
    - name: uniqueIds
      type: slice
      primitive: string
config:
- name: cookieAuthOnly
  type: bool
  description: When true, the sessions (after authentication) would not return the
    token back in the response, and token will be only accessible via secure cookie.
- name: clickhouseDsn
  type: string
  description: In case of using clickhouse replica option, then you need to provide
    this configuration for connection, make sure you add the username, password also
    in the same dsn
  hint: 127.0.0.1:9000
- name: mongodbDsn
  type: string
  description: In case of mongodb replica option, you need to provide the installation
    url and all necessary config
  hint: defaultmongodb instalaltion
- name: elasticsearchDsn
  type: string
  description: Elastic search installation url in case some entities require to write
    into the elastic search.
  hint: default elastic search installation
- name: production
  type: bool
  description: If true, set's the environment behavior to production, and some functionality
    will be limited
- name: redisEventsUrl
  type: string
  description: The address of the redis, which will be used to distribute the events.
    If provided empty, internal golang event library will be used, and events won't
    be distributed across different instances
  default: 127.0.0.1:6379
- name: tablePrefix
  type: string
  description: Prefix all gorm tables with some string
- name: vapidPublicKey
  type: string
  description: VAPID Web push notification public key
- name: vapidPrivateKey
  type: string
  description: VAPID Web push notification private key
- name: tokenGenerationStrategy
  type: string
  description: Fireback supports generating tokens based on random short string, or
    jwt.
  default: random
- name: jwtSecretKey
  type: string
  description: If tokenGenerationStrategy is set to jwt, then these secret will be
    used.
- name: withTaskServer
  type: bool
  description: Runs the tasks server asyncq library when the http server starts. Useful
    for all in one applications to run everything in single instance
  default: "false"
- name: name
  description: Environment name, such as dev, prod, test, test-eu, etc...
- name: dbName
  description: Database name for vendors which provide database names, such as mysql.
    Filename on disk for sqlite.
  default: ':memory:'
- name: certFile
  description: SSL Certification location to server on http listener
- name: keyFile
  description: SSL Certification key file
- name: dbLogLevel
  description: Database log level for SQL queries, used by GORM orm. Default it's
    silent. 'warn', 'error', 'info' are other options.
  default: silent
- name: useSSL
  type: bool
  description: If set to true, all http traffic will be redirected into https. Needs
    certFile and keyFile to be defined otherwise no effect
- name: dbPort
  type: int64
  description: Database port for those which are having a port, 3306 on mysql for
    example
- name: driveEnabled
  type: bool
  description: Drive is a mechanism to have file upload and download, inlining integrated
    into the fireback
  default: "true"
- name: dbDsn
  description: Connection dsn to database. Some databases allow connection using a
    string with all credentials and configs. This has hight priority, if set other
    details will be ignored.
- name: dbHost
  description: Database host, such as localhost, or 127.0.0.1
- name: dbUsername
  description: Database username for connection, such as root.
- name: dbPassword
  description: Database password for connection. Can be empty if there is no password
- name: ginMode
  description: Gin framework mode, which could be 'test', 'debug', 'release'
- name: storage
  description: This is the storage url which files will be uploaded to
- name: dbVendor
  description: Database vendor name, such as sqlite, mysql, or any other supported
    database.
  default: sqlite
- name: stdOut
  description: Writes the logs instead of std out into these log files.
- name: workerAddress
  description: This is the url (host and port) of a queue service. If not set, we
    use the internal queue system
  default: 127.0.0.1:6379
- name: workerConcurrency
  type: int
  description: How many tasks worker can take concurrently
  default: "10"
- name: stdErr
  description: Writes the errors instead of std err into these log files.
- name: tusPort
  description: Resumable file upload server port.
- name: cliToken
  description: Authorization token for cli apps, to access resoruces similar on http
    api
- name: cliRegion
  description: Region, for example us or pl
  default: us
- name: cliLanguage
  description: Language of the cli operations, for example en or pl
  default: en
- name: cliWorkspace
  description: Selected workspace in the cli context.
- name: port
  type: int64
  description: The port which application would be lifted
  default: "4500"
- name: host
  description: Application host which http server will be lifted
  default: localhost
- name: macIdentifier
  description: Used name for installing app as system service on macos installers
  default: fireback
- name: debianIdentifier
  description: Used name for installing app as system service on ubuntu installers
  default: fireback
- name: windowsIdentifier
  description: Used name for installing app as system service on windows installers
  default: fireback
