targets:
- compiler: js
  flags:
    js-sdk-location: '@fireback/js-remote-ctx'
  output: ../../../ui/packages/finance/wallet/sdk
  tags:
  - typescript
  - react
  - no-sdk
  - no-package
- compiler: go
  flags:
    pkg: walletdefs
  output: ./defs
- compiler: preprocessor
  output: .
description: 'Internal wallet engine: wallets (owned by a user or a workspace), supported
  currencies (fiat and crypto), the append-only balance-history ledger, registered
  payment gateways, payment/topup attempts against those gateways, raw gateway event
  log, and root-only wallet limits configuration. Owner- facing endpoints (create/list/topup/history
  for the wallet''s own owner) live in the separate walletpublic module, which reads
  these same tables through Go, not through this module''s HTTP surface.'
name: wallet
dtos:
- description: Every field of the "wallet" entity, but optional - used both as Update's
    partial input and as Browse's response item shape.
  name: walletOptional
  fields:
  - name: uniqueId
    type: string?
  - name: ownerType
    description: 'Who owns this wallet: "user" (userId is set, workspaceId empty)
      or "workspace" (workspaceId is set, userId empty). Exactly one of userId/workspaceId
      is populated, matching ownerType.'
    type: string?
    tags:
      validate: required,oneof=user workspace
  - name: userId
    description: Unique id of the owning user. Set only when ownerType is "user".
    type: string?
  - name: workspaceId
    description: Unique id of the owning workspace. Set only when ownerType is "workspace".
    type: string?
  - name: currency
    description: Currency code this wallet holds (must match an active walletCurrency.code,
      e.g. "USD" or "BTC"). Fixed for the wallet's lifetime - a currency change would
      invalidate its whole balance history, so a new wallet is created instead.
    type: string?
    tags:
      validate: required
  - name: balance
    description: Current balance as a decimal string of integer minor-units at the
      wallet's currency's declared precision (see walletCurrency.decimals). Never
      read or written as a float. Only ever mutated inside a locked DB transaction
      by wallet.Purchase/adjustBalance, mirrored by a walletTransaction ledger row
      on every change.
    type: string?
    default: "0"
  - name: status
    description: '"active" wallets can be topped up and purchased from. "frozen" blocks
      purchases/topups but keeps the wallet visible (e.g. pending dispute). "closed"
      is a terminal, non-reactivatable state.'
    type: string?
    default: active
    tags:
      validate: required,oneof=active frozen closed
  - name: label
    description: Optional owner-given nickname for the wallet (e.g. "Main", "Savings")
      - purely cosmetic, shown in the owner-facing UI.
    type: string?
  - name: isDefault
    description: Whether this is the owner's default wallet for its currency, used
      by internal purchase callers that don't specify a walletId explicitly. At most
      one wallet per (owner, currency) should have this set - enforced in Go, not
      at the DB level.
    type: bool?
    default: false
  - name: version
    description: Incremented on every balance mutation. The actual concurrency guard
      is a DB row lock (SELECT ... FOR UPDATE) taken during purchase/adjustBalance;
      this field is a defense-in-depth optimistic check and an easy audit signal ("has
      this wallet ever moved").
    type: int64?
    default: 0
- description: Every field of the "walletCurrency" entity, but optional - used both
    as Update's partial input and as Browse's response item shape.
  name: walletCurrencyOptional
  fields:
  - name: uniqueId
    type: string?
  - name: code
    description: Currency code, e.g. "USD", "EUR", "BTC", "ETH". Unique across all
      currencies.
    type: string?
    tags:
      validate: required
  - name: name
    description: Display name, e.g. "US Dollar" or "Bitcoin".
    type: string?
    tags:
      validate: required
  - name: kind
    description: Whether this is a fiat or crypto currency.
    type: string?
    tags:
      validate: required,oneof=fiat crypto
  - name: decimals
    description: Number of decimal places a minor-unit amount string represents for
      this currency (e.g. 2 for USD so "10050" means $100.50, 8 for BTC, 18 for ETH).
      Every wallet/transaction/attempt amount in this currency must be interpreted
      at this precision.
    type: int?
    tags:
      validate: required
  - name: symbol
    description: Optional display symbol, e.g. "$" or "₿".
    type: string?
  - name: isActive
    description: Whether wallets/topups can currently be created in this currency.
      Existing wallets in a deactivated currency keep working; only new creation is
      blocked.
    type: bool?
    default: true
- description: Every field of the "walletTransaction" entity, but optional - used
    both as Update's partial input and as Browse's response item shape.
  name: walletTransactionOptional
  fields:
  - name: uniqueId
    type: string?
  - name: wallet
    description: The wallet this ledger entry belongs to.
    type: one?
    target: WalletDto
    tags:
      validate: required
  - name: direction
    description: '"credit" increases the wallet''s balance, "debit" decreases it.
      amount is always a positive minor-units string; direction carries the sign.'
    type: string?
    tags:
      validate: required,oneof=credit debit
  - name: amount
    description: Magnitude of this change, as a positive decimal string of integer
      minor-units at the wallet's currency precision.
    type: string?
    tags:
      validate: required
  - name: balanceAfter
    description: Snapshot of the wallet's balance immediately after this entry was
      applied, as a minor-units string. Kept for audit/debugging even though it's
      derivable by replaying the ledger.
    type: string?
    tags:
      validate: required
  - name: reason
    description: What kind of event produced this ledger entry.
    type: string?
    tags:
      validate: required,oneof=topup purchase refund adjustment transfer_in transfer_out
        fee chargeback
  - name: referenceType
    description: Free-form identifier of the calling module/feature that caused this
      entry, e.g. "course-purchase" - lets other nima modules tag their own purchases
      without editing this module's yaml.
    type: string?
  - name: referenceId
    description: Id within referenceType this entry relates to (e.g. the order id
      in the calling module).
    type: string?
  - name: idempotencyKey
    description: Caller-supplied key that makes the operation that produced this entry
      safe to retry - a second call with the same key returns the existing row instead
      of double-applying the change. Unique across all wallet transactions.
    type: string?
    tags:
      validate: required
  - name: note
    description: Optional human-readable note, e.g. why an adjustment was made.
    type: string?
  - name: createdBy
    description: Unique id of the user who triggered this entry, or a fixed marker
      such as "system" or the gateway code, for entries with no human actor.
    type: string?
  - name: createdAt
    description: When this ledger entry was recorded.
    type: complex
    complex: XDate
  - name: metadata
    description: Extra structured, reason-specific data (e.g. gateway fee breakdown)
      not worth a dedicated column.
    type: complex
    complex: JSON
- description: Every field of the "walletGateway" entity, but optional - used both
    as Update's partial input and as Browse's response item shape.
  name: walletGatewayOptional
  fields:
  - name: uniqueId
    type: string?
  - name: code
    description: Unique code identifying this gateway's GatewayAdapter implementation,
      e.g. "stripe", "manual", "onchain_eth".
    type: string?
    tags:
      validate: required
  - name: name
    description: Display name shown to wallet owners choosing a topup method.
    type: string?
    tags:
      validate: required
  - name: kind
    description: Whether this gateway settles in fiat or crypto.
    type: string?
    tags:
      validate: required,oneof=fiat crypto
  - name: isActive
    description: Whether wallet owners can currently start a topup through this gateway.
    type: bool?
    default: true
  - name: config
    description: Provider configuration. Must only hold references to secrets (e.g.
      a secrets-manager key name), never raw API keys/webhook secrets in plaintext.
    type: complex
    complex: JSON
  - name: supportedCurrencies
    description: JSON array of walletCurrency codes this gateway can top up (e.g.
      ["USD","EUR"]).
    type: complex
    complex: JSON
- description: Every field of the "walletPaymentAttempt" entity, but optional - used
    both as Update's partial input and as Browse's response item shape.
  name: walletPaymentAttemptOptional
  fields:
  - name: uniqueId
    type: string?
  - name: wallet
    description: The wallet this attempt would credit/debit if it succeeds.
    type: one?
    target: WalletDto
    tags:
      validate: required
  - name: gateway
    description: The gateway this attempt is routed through.
    type: one?
    target: WalletGatewayDto
    tags:
      validate: required
  - name: purpose
    description: What this attempt is for.
    type: string?
    default: topup
    tags:
      validate: required,oneof=topup purchase withdrawal
  - name: amount
    description: Requested amount as a minor-units string, in currency.
    type: string?
    tags:
      validate: required
  - name: currency
    description: Currency code for amount - must match the wallet's currency.
    type: string?
    tags:
      validate: required
  - name: status
    description: Current lifecycle state of this attempt.
    type: string?
    default: pending
    tags:
      validate: required,oneof=pending requires_action succeeded failed cancelled
        expired
  - name: gatewayReference
    description: The gateway's own id for this attempt (e.g. a PaymentIntent id or
      a transaction hash), once known. Indexed for webhook lookups.
    type: string?
  - name: idempotencyKey
    description: Caller-supplied key making topup-initiation safe to retry without
      creating duplicate attempts at the gateway.
    type: string?
    tags:
      validate: required
  - name: createdAt
    description: When this attempt was created.
    type: complex
    complex: XDate
  - name: failureReason
    description: Human-readable reason, populated when status is "failed".
    type: string?
  - name: rawRequest
    description: The raw request sent to the gateway when initiating this attempt.
    type: complex
    complex: JSON
  - name: rawResponse
    description: The raw response/init payload received back from the gateway.
    type: complex
    complex: JSON
  - name: walletTransaction
    description: The ledger entry that was created once this attempt succeeded. Empty
      until then.
    type: one?
    target: WalletTransactionDto
  - name: expiresAt
    description: When this attempt expires if not completed (gateway-dependent). Empty
      if the gateway doesn't impose one.
    type: complex
    complex: XDate
  - name: completedAt
    description: When this attempt reached a terminal status. Empty until then.
    type: complex
    complex: XDate
  - name: returnUrl
    description: Where to send the caller's browser back to once a redirect-based
      gateway (e.g. Przelewy24, ZarinPal) completes the payment. Not needed by gateways
      that never redirect the browser (e.g. Stripe's client-secret confirmation flow).
    type: string?
- description: Every field of the "walletEvent" entity, but optional - used both as
    Update's partial input and as Browse's response item shape.
  name: walletEventOptional
  fields:
  - name: uniqueId
    type: string?
  - name: gateway
    description: The gateway this event came from.
    type: one?
    target: WalletGatewayDto
    tags:
      validate: required
  - name: eventType
    description: Gateway-specific event type string, e.g. "payment_intent.succeeded".
    type: string?
    tags:
      validate: required
  - name: externalEventId
    description: The gateway's own id for this event, when it provides one - used
      to deduplicate webhook retries.
    type: string?
  - name: payload
    description: The full raw event payload as received from the gateway.
    type: complex
    complex: JSON
  - name: processed
    description: Whether this event was successfully applied (e.g. wallet credited).
    type: bool?
    default: false
  - name: processingError
    description: Error message from the last failed processing attempt, if any.
    type: string?
  - name: paymentAttempt
    description: The payment attempt this event relates to, if identifiable.
    type: one?
    target: WalletPaymentAttemptDto
  - name: receivedAt
    description: When this event was received.
    type: complex
    complex: XDate
- description: Every field of the "walletConfig" entity, but optional - used both
    as Update's partial input and as Browse's response item shape.
  name: walletConfigOptional
  fields:
  - name: uniqueId
    type: string?
  - name: maxWalletsPerUser
    description: Maximum number of wallets a single user may own in total, across
      all currencies. 0 means unlimited.
    type: int64?
    default: 5
  - name: maxWalletsPerWorkspace
    description: Maximum number of wallets a single workspace may own in total, across
      all currencies. 0 means unlimited.
    type: int64?
    default: 5
  - name: maxWalletsPerUserPerCurrency
    description: Maximum wallets a user may own in a single currency. Empty means
      no per-currency limit beyond maxWalletsPerUser.
    type: int64?
  - name: maxWalletsPerWorkspacePerCurrency
    description: Maximum wallets a workspace may own in a single currency. Empty means
      no per-currency limit beyond maxWalletsPerWorkspace.
    type: int64?
- description: Every field of the "walletProviderConfig" entity, but optional - used
    both as Update's partial input and as Browse's response item shape.
  name: walletProviderConfigOptional
  fields:
  - name: uniqueId
    type: string?
  - name: providerType
    description: Which GatewayAdapter this configures - must match a registered adapter's
      Code(), e.g. "stripe", "przelewy24", "blik", "zarinpal". Free-form (not a closed
      oneof) so a new provider package doesn't require a schema change here.
    type: string?
    tags:
      validate: required
  - name: region
    description: 'Which region this config applies to - an ISO-3166-ish code (e.g.
      "PL", "IR", "US") or "global", meaning every region. Combined with providerType,
      must be unique: you can''t have two rows configuring the same provider for the
      same region.'
    type: string?
    default: global
    tags:
      validate: required
  - name: isEnabled
    description: Whether this provider+region combination is currently usable. Toggled
      through the regular update action - there is no dedicated enable/disable endpoint.
    type: bool?
    default: false
  - name: config
    description: Provider-specific, non-secret settings (e.g. preferred/allowed currencies,
      routing hints, sandbox overrides). Must never hold raw API keys/secrets - those
      stay in each provider package's own environment variables (see modules/wallet/providers/*'s
      doc comments), matching walletGateway.config's same convention.
    type: complex
    complex: JSON
