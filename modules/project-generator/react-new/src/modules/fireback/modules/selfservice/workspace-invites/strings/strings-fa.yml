content:
  coverLetter: متن دعوت‌نامه
  coverLetterHint: متنی که کاربر از طریق پیامک یا ایمیل دریافت می‌کند؛ می‌توانید آن
    را در اینجا تغییر دهید.
  createInvitation: ایجاد دعوت نامه
  editInvitation: ویرایش دعوت نامه
  email: آدرس ایمیل
  emailHint: آدرس ایمیل دعوت کننده، آنها پیوند را با استفاده از این ایمیل دریافت خواهند
    کرد
  firstName: نام کوچک
  firstNameHint: نام دعوت شده را بنویسید
  forcedEmailAddress: الزام آدرس ایمیل
  forcedEmailAddressHint: در صورت فعال بودن، کاربر فقط می‌تواند با این آدرس ایمیل
    دعوت‌نامه را ایجاد کند و امکان تغییر آن را نخواهد داشت. اگر حساب کاربری از قبل
    وجود داشته باشد، باید دعوت‌نامه را از همان‌جا بپذیرد.
  forcedPhone: الزام شماره تلفن
  forcedPhoneHint: در صورت فعال بودن، کاربر فقط می‌تواند با این شماره تلفن ایجاد یا
    عضو شود
  lastName: نام خانوادگی
  lastNameHint: نام خانوادگی دعوت شده را بنویسید
  menuTitle: دعوت نامه ها
  phoneNumber: شماره تلفن
  phoneNumberHint: شماره تلفن دعوت شوندگان، اگر شماره آنها را نیز ارائه دهید، از طریق
    پیامک دعوتنامه دریافت خواهند کرد
  roleHint: نقش(هایی) را که می خواهید به کاربر هنگام پیوستن به فضای کاری بدهید، انتخاب
    کنید. این را می توان بعدا نیز تغییر داد.
  roleLabel: نقش
  targetLocale: زبان مقصد
  targetLocaleHint: اگر کاربر زبان دیگری در دسترس داشته باشد، رابط کاربری اولیه بر
    اساس مقدار انتخاب‌شده خواهد بود.
