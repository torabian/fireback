extends: []
content:
  workspaceConfigs:
    archiveTitle: تنظیمات فضای کاری
    description: نحوه عملکرد فضاهای کاری را از نظر رمز یکبار مصرف زمان‌دار (TOTP)،
      الزام رمز یکبار مصرف، ری‌کپچا و نحوه تعامل کاربر با برنامه پیکربندی کنید.
    editWorkspaceConfig: ویرایش تنظیمات فضای کاری
    emailOtpContentHint: هنگام درخواست رمز یکبار مصرف برای ایمیل، این محتوا برای تکمیل
      پیامی که برای کاربر ارسال می‌شود استفاده خواهد شد.
    emailOtpContentLabel: محتوای رمز یکبار مصرف ایمیل
    enableOtp: فعال‌سازی رمز یکبار مصرف
    enableOtpHint: رمز یکبار مصرف را برای بخش خودسرویس فعال می‌کند. این امکان را می‌دهد
      که ایمیل یا شماره تلفن به‌جای رمز عبور، یک کد ۶ رقمی در صندوق ورودی یا تلفن
      خود دریافت کنند.
    enableRecaptcha2: فعال‌سازی reCAPTCHA2
    enableRecaptcha2Hint: یکپارچه‌سازی reCAPTCHA2 گوگل را در بخش خودسرویس پروژه فعال
      می‌کند. برای فعال شدن باید کلید سرور و کلید کلاینت را وارد کنید.
    enableTotp: فعال‌سازی TOTP
    enableTotpHint: رمز یکبار مصرف زمان‌دار را برای ایجاد حساب و ورود فعال می‌کند.
    forcePasswordOnPhone: الزام رمز عبور برای تلفن
    forcePasswordOnPhoneHint: الزام رمز عبور برای تلفن
    forcePersonNameOnPhone: الزام نام شخص برای تلفن
    forcePersonNameOnPhoneHint: الزام نام شخص برای تلفن
    forceTotp: الزام TOTP
    forceTotpHint: استفاده از TOTP را برای ایجاد حساب الزامی می‌کند. اگر حسابی این
      تنظیم را نداشته باشد، باید پیش از ورود آن را راه‌اندازی کند.
    generalEmailProviderHint: سرویس ارائه‌دهنده ایمیل که برای ارسال پیام‌ها از طریق
      آن استفاده می‌شود. این تنظیم بر محتوای پیام تأثیری ندارد، بلکه مشخص می‌کند از
      طریق کدام سرویس شخص ثالث یا حتی سرویس SMTP اختصاصی خودتان ایمیل‌ها ارسال شوند.
    generalEmailProviderLabel: ارائه‌دهنده ایمیل عمومی
    generalGsmProviderHint: سرویس عمومی که برای ارسال پیامک با استفاده از خدمات یا
      API آن به‌کار می‌رود.
    generalGsmProviderLabel: ارائه‌دهنده پیامک عمومی
    inviteToWorkspaceContentHint: این قالب به‌طور پیش‌فرض هنگامی استفاده می‌شود که
      کاربری شخص دیگری را به فضای کاری خود دعوت می‌کند.
    inviteToWorkspaceContentLabel: محتوای دعوت به فضای کاری
    newWorkspaceConfig: تنظیمات فضای کاری جدید
    otpSectionDescription: مدیریت احراز هویت کاربر با استفاده از رمز یکبار مصرف از
      طریق پیامک یا ایمیل
    otpSectionTitle: رمز یکبار مصرف (OTP)
    passwordSectionDescription: نحوه استفاده کاربران از رمز عبور را پیکربندی کنید
    passwordSectionTitle: مدیریت رمز عبور
    recaptcha2ClientKey: کلید کلاینت
    recaptcha2ClientKeyHint: کلید کلاینت برای reCAPTCHA2
    recaptcha2ServerKey: کلید سرور
    recaptcha2ServerKeyHint: کلید سرور برای reCAPTCHA2
    recaptchaSectionDescription: گزینه‌های مربوط به reCAPTCHA2 را برای برنامه پیکربندی
      کنید.
    recaptchaSectionTitle: بخش ری‌کپچا
    requireOtpOnSignin: الزام رمز یکبار مصرف هنگام ورود
    requireOtpOnSigninHint: پاسپورت‌هایی مانند تلفن و ایمیل را ملزم می‌کند حتی در
      صورت داشتن رمز عبور، ورود را با کد ۶ رقمی تأیید کنند. OAuth از این قانون مستثناست.
    requireOtpOnSignup: الزام رمز یکبار مصرف هنگام ثبت‌نام
    requireOtpOnSignupHint: ایجاد حساب را ملزم می‌کند ابتدا تأیید رمز یکبار مصرف انجام
      شود و سپس فرآیند ادامه یابد.
    smsOtpContentHint: هنگام ارسال پیامک رمز یکبار مصرف، این قالب برای ساخت آن پیامک،
      شامل کد رمز یکبار مصرف، استفاده می‌شود.
    smsOtpContentLabel: محتوای پیامک رمز یکبار مصرف
    title: تنظیمات فضای کاری
    totpSectionDescription: استفاده از اپلیکیشن احراز هویت به‌عنوان یک لایه امنیتی
      دوم برای رمز عبور.
    totpSectionTitle: TOTP (تأیید دومرحله‌ای زمان‌دار)
