name: eventbus

targets:
  - compiler: go
    output: ./defs
    flags:
      pkg: eventbusdefs

  # Not consumed by any ui/packages/* today (see ui/packages/README.md) - written into
  # ui-core, the shared base every other frontend package already depends on, so it's
  # ready the moment something needs it instead of picking an arbitrary owner later.
  - compiler: js
    output: ../../ui/packages/ui-core/sdk/eventbus
    clean: true
    flags:
      js-sdk-location: "@fireback/js-remote-ctx"
    tags:
      - typescript
      - react
      - no-sdk
      - no-package
  - compiler: preprocessor
    output: ./

description:
  Connects users to a socket, and conveys messages/notifications to them, with
  optional Redis-backed distribution across instances. Split out of modules/fireback
  (which used to start this unconditionally for every project and hardcode its route)
  so a project only pays for it - the background goroutine and the /ws route - if its
  main.go actually calls eventbus.ModuleSetup(...).

actions:
  - name: EventBusSubscription
    description: Connects a client to all events related to their user profile, or workspace they are in
    method: reactive
    url: /ws
