targets:
- compiler: go
  flags:
    pkg: eventbus
  output: ./
- compiler: js
  flags:
    js-sdk-location: ../sdk
  output: ../../ui/src/modules/sdk/eventbus
  tags:
  - typescript
  - react
  - no-sdk
- compiler: preprocessor
  output: ./
description: Connects users to a socket, and conveys messages/notifications to them,
  with optional Redis-backed distribution across instances. Split out of modules/fireback
  (which used to start this unconditionally for every project and hardcode its route)
  so a project only pays for it - the background goroutine and the /ws route - if
  its main.go actually calls eventbus.ModuleSetup(...).
name: eventbus
actions:
- name: EventBusSubscription
  url: /ws
  method: reactive
  description: Connects a client to all events related to their user profile, or workspace
    they are in
