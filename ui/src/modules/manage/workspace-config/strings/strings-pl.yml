extends: []
content:
  workspaceConfigs:
    archiveTitle: Workspace configs
    description: Configurate how the workspaces work in terms of totp, forced otp,
      recaptcha and how the user can interact with the application.
    editWorkspaceConfig: Edit workspace config
    emailOtpContentHint: Po żądaniu jednorazowego kodu e-mail, ta treść zostanie
      użyta do utworzenia wiadomości wysyłanej do użytkownika.
    emailOtpContentLabel: Treść kodu jednorazowego e-mail
    enableOtp: Enable otp
    enableOtpHint: Enables the one time password for the selfservice. It would allow
      email or phone numbers to bypass password and recieve a 6 digit code on their
      inbox or phone.
    enableRecaptcha2: Enable reCAPTCHA2
    enableRecaptcha2Hint: Enables reCAPTCHA2 from google integration into the project
      selfservice. You need to provide Server Key and Client Key to make it effective.
    enableTotp: Enable totp
    enableTotpHint: Enables time based otp for account creation and signin.
    forcePasswordOnPhone: Force password on phone
    forcePasswordOnPhoneHint: Force password on phone
    forcePersonNameOnPhone: Force person name on phone
    forcePersonNameOnPhoneHint: Force person name on phone
    forceTotp: Force totp
    forceTotpHint: Forces the totp for account creation. If an account doesn't have
      it, they need to setup before they can login.
    generalEmailProviderHint: Usługa dostawcy e-mail, która będzie używana do wysyłania
      wiadomości. Nie wpływa na treść wiadomości - wybierasz tutaj, za pomocą jakiej
      usługi zewnętrznej lub własnego serwera SMTP wysyłane będą e-maile.
    generalEmailProviderLabel: Domyślny dostawca e-mail
    generalGsmProviderHint: Ogólna usługa używana do wysyłania wiadomości tekstowych
      (SMS) za pomocą swoich usług lub API.
    generalGsmProviderLabel: Domyślny dostawca SMS
    inviteToWorkspaceContentHint: Ten szablon będzie używany domyślnie, gdy użytkownik
      zaprasza inną osobę do swojej przestrzeni roboczej.
    inviteToWorkspaceContentLabel: Treść zaproszenia do przestrzeni roboczej
    newWorkspaceConfig: New workspace config
    otpSectionDescription: Manage the user authentication using single time password
      over sms/email
    otpSectionTitle: OTP (One time password)
    passwordSectionDescription: Configurate the usage of password by users
    passwordSectionTitle: Password management
    recaptcha2ClientKey: Client key
    recaptcha2ClientKeyHint: Client key for reCAPTCHA2
    recaptcha2ServerKey: Server key
    recaptcha2ServerKeyHint: Server key for reCAPTCHA2
    recaptchaSectionDescription: Configurate the recaptcha 2 related options for the
      application.
    recaptchaSectionTitle: Recaptcha section
    requireOtpOnSignin: Require otp on signin
    requireOtpOnSigninHint: Forces passports such as phone and email to approve signin
      with 6 digit code, even if the passport has a password. OAuth is exempted.
    requireOtpOnSignup: Require otp on signup
    requireOtpOnSignupHint: It would force account creation to first make a one time
      password verification and then continue the process.
    smsOtpContentHint: Przy wysyłce SMS z kodem jednorazowym, ten szablon zostanie
      użyty do utworzenia takiej wiadomości, wraz z kodem jednorazowym.
    smsOtpContentLabel: Treść kodu jednorazowego SMS
    title: Workspace Config
    totpSectionDescription: Usage of the authenticator app as a second security step
      for the password.
    totpSectionTitle: TOTP (Time based Dual Factor)
    notificationsSectionTitle: Powiadomienia
    notificationsSectionDescription: Wybierz, który dostawca domyślnie wysyła e-maile/SMS-y
      oraz jakie szablony są używane do zaproszeń i kodów jednorazowych.
