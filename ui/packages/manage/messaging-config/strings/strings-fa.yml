content:
  messagingConfigs:
    archiveTitle: تنظیمات پیام‌رسانی
    title: تنظیمات پیام‌رسانی
    description: ارائه‌دهنده‌های پیش‌فرض ایمیل/پیامک و قالب‌های استفاده‌شده در کل نصب (نه به‌ازای هر فضای کاری) را پیکربندی کنید.
    editMessagingConfig: ویرایش تنظیمات پیام‌رسانی
    newMessagingConfig: تنظیمات پیام‌رسانی جدید
    notificationsSectionTitle: اطلاع‌رسانی‌ها
    notificationsSectionDescription: مشخص کنید کدام سرویس به‌طور پیش‌فرض ایمیل/پیامک ارسال کند، و کدام قالب‌ها برای دعوت به فضای کاری و رمزهای یکبار مصرف استفاده شوند.
    generalEmailProviderLabel: ارائه‌دهنده ایمیل عمومی
    generalEmailProviderHint: سرویس ارائه‌دهنده ایمیل که برای ارسال پیام‌ها از طریق آن استفاده می‌شود. این تنظیم بر محتوای پیام تأثیری ندارد، بلکه مشخص می‌کند از طریق کدام سرویس شخص ثالث یا حتی سرویس SMTP اختصاصی خودتان ایمیل‌ها ارسال شوند.
    generalGsmProviderLabel: ارائه‌دهنده پیامک عمومی
    generalGsmProviderHint: سرویس عمومی که برای ارسال پیامک با استفاده از خدمات یا API آن به‌کار می‌رود.
    inviteToWorkspaceContentLabel: محتوای دعوت به فضای کاری
    inviteToWorkspaceContentHint: این قالب به‌طور پیش‌فرض هنگامی استفاده می‌شود که کاربری شخص دیگری را به فضای کاری خود دعوت می‌کند.
    emailOtpContentLabel: محتوای رمز یکبار مصرف ایمیل
    emailOtpContentHint: هنگام درخواست رمز یکبار مصرف برای ایمیل، این محتوا برای تکمیل پیامی که برای کاربر ارسال می‌شود استفاده خواهد شد.
    smsOtpContentLabel: محتوای پیامک رمز یکبار مصرف
    smsOtpContentHint: هنگام ارسال پیامک رمز یکبار مصرف، این قالب برای ساخت آن پیامک، شامل کد رمز یکبار مصرف، استفاده می‌شود.
